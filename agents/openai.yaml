interface:
  display_name: "Luz Design"
  short_description: "Visual standards, product UI and prototype visuals, posters and brand visuals, document and file layout"
  default_prompt: "Use Luz Design for visual and layout work. First run py -X utf8 scripts/context.py list and read the rule card for the task kind (preferences, lessons, rule text, tools, checks); templates and make_xlsx.py / make_docx.py are skeletons only. For a whole interface project (admin, mini-program, website, agent UI, prototype) start with the rule card design-path (the ten-stage path and thinking chain) and then page-patterns (home and common page paradigms, entrance ownership); paste py -X utf8 scripts/design_path.py checklist --surface <surface> into BRIEF, and with Luz-System's entrances.json run scripts/page_pattern.py brief, plan, check and, on the built page, check-page. To turn the pages into the clickable front-end interface HTML of product development (three-column single-file prototype, one tab per system), read the rule card prototype-reference: the prototype reference implementation (scripts/build_prototype.py, scripts/build_prototype_suite.py) and the numbered component template library (data-cid, luz-kit) are references, not templates, and the page list and home page never come from the examples; audit with scripts/audit_rendered.py --library luz-kit in light and dark. Record the rules applied in BRIEF 采用的规则, pass check_document.py, then note new lessons with experience.py. Product UI visuals and prototype looks (composition, component looks, icons, images, motion, themes) are made here from the functional spec; route system design, the functional structure of product UI (pages, entrances, tab bar items, components, button actions, flows), prototype behaviour and hardware to Luz System (references/ui-ownership.md draws the line)."
