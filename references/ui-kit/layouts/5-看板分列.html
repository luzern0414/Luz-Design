<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>看板分列：订单履约</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f6b4f'/%3E%3Crect x='8' y='8' width='7' height='7' rx='1.5' fill='none' stroke='%23fff' stroke-width='2'/%3E%3Crect x='17' y='8' width='7' height='7' rx='1.5' fill='none' stroke='%23fff' stroke-width='2'/%3E%3Crect x='8' y='17' width='16' height='7' rx='1.5' fill='none' stroke='%23fff' stroke-width='2'/%3E%3C/svg%3E">
<script>(function(){var K='luz-theme',r=document.documentElement;function g(){try{var v=localStorage.getItem(K);return v==='light'||v==='dark'?v:'system'}catch(e){return'system'}}function a(m){if(m==='light'||m==='dark')r.setAttribute('data-theme',m);else r.removeAttribute('data-theme')}window.luzTheme={get:g,set:function(m){try{if(m==='light'||m==='dark')localStorage.setItem(K,m);else localStorage.removeItem(K)}catch(e){}a(m)}};a(g())})();</script>
<link rel="stylesheet" href="../ui.css">
</head>
<body>
<h1 class="page-title">订单履约</h1>
<section class="page">
<h2 class="sr-only">页面内容</h2>
<header class="page-head"><div><p class="muted">按状态分列，列头写列名与数量；拖动卡片，或用卡片右上角的菜单移到别的列</p></div><div class="actions"><button class="btn btn--primary" id="add">模拟新订单</button></div></header>
<section id="board" aria-label="订单看板"></section>
<div class="appearance-row"><span>外观</span><span id="appearance"></span></div>
</section>
<script src="../ui.js"></script>
<script>
UI.appearance(document.getElementById('appearance'));
const mk = (id, n, t, items, min) => ({id, title: n, meta: items, money: t, min});
const cols = [
  {id: 'wait', title: '待支付', cards: [mk('o1', 'A31', 1800, '招牌牛腩饭 ×1', 3), mk('o2', 'A32', 3600, '红烧鸡腿饭 ×2', 1)]},
  {id: 'make', title: '待出餐', cards: [mk('o3', 'A27', 2200, '黑椒牛柳饭 ×1', 18), mk('o4', 'A28', 4400, '清蒸鲈鱼套餐 ×1，粥品早餐 ×1', 11), mk('o5', 'A29', 1900, '轻食鸡胸沙拉 ×1', 6)]},
  {id: 'ready', title: '已出餐', cards: [mk('o6', 'A24', 2600, '清蒸鲈鱼套餐 ×1', 2), mk('o7', 'A25', 1500, '田园素食套餐 ×1', 4)]},
  {id: 'done', title: '已完成', cards: [mk('o8', 'A21', 1800, '宫保鸡丁饭 ×1', 0), mk('o9', 'A22', 2200, '番茄牛腩饭 ×1', 0), mk('o10', 'A23', 1700, '鱼香肉丝饭 ×1', 0)]},
];
UI.kanban(document.getElementById('board'), {columns: cols, card: (c) => UI.h('div.stack', {style: {gap: 'var(--s-2)', paddingRight: '28px'}}, UI.h('div.row.between', {}, UI.h('strong', {text: '取餐号 ' + c.title}), UI.h('span.num', {text: UI.money(c.money)})), UI.h('span.muted', {text: c.meta}), c.min > 10 ? UI.h('span.badge.badge--warn', {text: '已等 ' + c.min + ' 分钟'}) : UI.h('span.muted.num', {text: c.min ? '已等 ' + c.min + ' 分钟' : '已取走'})), onMove: (id, from, to) => UI.toast('已移到「' + cols.find((c) => c.id === to).title + '」')});
let n = 33; document.getElementById('add').addEventListener('click', () => UI.toast('新订单 A' + n++ + ' 已进入「待支付」'));
document.querySelectorAll('.kcard').forEach((el) => { el.style.position = 'relative'; const b = el.querySelector('button'); b.style.position = 'absolute'; b.style.top = '4px'; b.style.right = '4px'; });
</script>
</body>
</html>
