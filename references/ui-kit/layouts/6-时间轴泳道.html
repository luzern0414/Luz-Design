<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>时间轴泳道：门店排班</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f6b4f'/%3E%3Crect x='8' y='8' width='7' height='7' rx='1.5' fill='none' stroke='%23fff' stroke-width='2'/%3E%3Crect x='17' y='8' width='7' height='7' rx='1.5' fill='none' stroke='%23fff' stroke-width='2'/%3E%3Crect x='8' y='17' width='16' height='7' rx='1.5' fill='none' stroke='%23fff' stroke-width='2'/%3E%3C/svg%3E">
<script>(function(){var K='luz-theme',r=document.documentElement;function g(){try{var v=localStorage.getItem(K);return v==='light'||v==='dark'?v:'system'}catch(e){return'system'}}function a(m){if(m==='light'||m==='dark')r.setAttribute('data-theme',m);else r.removeAttribute('data-theme')}window.luzTheme={get:g,set:function(m){try{if(m==='light'||m==='dark')localStorage.setItem(K,m);else localStorage.removeItem(K)}catch(e){}a(m)}};a(g())})();</script>
<link rel="stylesheet" href="../ui.css">
</head>
<body>
<h1 class="page-title">门店排班</h1>
<section class="page">
<h2 class="sr-only">页面内容</h2>
<header class="page-head"><div><p class="muted">顶部是时间刻度，每行一条泳道；竖线是现在；红色是冲突，虚线块是空闲</p></div><div class="actions"><div class="seg" role="group" aria-label="日期"><button aria-pressed="false">昨天</button><button aria-pressed="true">今天</button><button aria-pressed="false">明天</button></div><button class="btn btn--primary">新增班次</button></div></header>
<section aria-label="排班泳道"><div id="lanes"></div><div class="legend" style="margin-top:var(--s-3)"><span><i style="background:var(--brand)"></i>正常班次</span><span><i style="background:var(--bad)"></i>时间冲突</span><span><i style="background:var(--warn)"></i>需确认</span><span><i style="background:none;border:1px dashed var(--line-strong)"></i>空闲</span></div></section>
<div class="appearance-row"><span>外观</span><span id="appearance"></span></div>
</section>
<script src="../ui.js"></script>
<script>
UI.appearance(document.getElementById('appearance'));
const L = (label, sub, events) => ({label, sub, events});
UI.lanes(document.getElementById('lanes'), {from: 7, to: 21, now: 10.5, lanes: [
  L('陈晓燕', '前台', [{from: 8, to: 12, title: '早班 前台'}, {from: 13, to: 17, title: '午班 前台'}]),
  L('刘洋', '后厨', [{from: 7, to: 11, title: '备料'}, {from: 10, to: 14, title: '出餐高峰'}, {from: 16, to: 20, title: '晚班'}]),
  L('周敏', '店长', [{from: 9, to: 12, title: '盘点'}, {from: 12, to: 13, title: '会议', kind: 'warn'}]),
  L('赵建国', '配送', []),
  L('何建平', '前台', [{from: 11, to: 15, title: '午高峰 前台'}, {from: 14, to: 18, title: '代班 前台'}]),
], onEvent: (e, l) => UI.dialog({title: e.title, size: 'sm', body: UI.h('div.stack', {}, UI.h('div.row.between', {}, UI.h('span.muted', {text: '人员'}), UI.h('strong', {text: l.label})), UI.h('div.row.between', {}, UI.h('span.muted', {text: '时间'}), UI.h('strong.num', {text: e.from + ':00 – ' + e.to + ':00'}))), actions: [{label: '关闭', value: null}, {label: '调整班次', kind: 'primary'}]})});
document.querySelectorAll('.seg button').forEach((b) => b.addEventListener('click', () => { document.querySelectorAll('.seg button').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); UI.toast('已切换到「' + b.textContent + '」'); }));
</script>
</body>
</html>
