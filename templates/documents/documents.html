<!doctype html>
<html lang="zh-CN" data-ic-base="../../kit/assets/icons" data-icons="mono" data-bg="glow">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文件模板</title>
<link rel="icon" href="../../kit/assets/icons/flat/bouquet.webp">
<link rel="stylesheet" href="../../kit/tokens.css">
<link rel="stylesheet" href="../../kit/ui.css">
<link rel="stylesheet" href="../../kit/kit.css">
<style>
  /* 打包外壳：顶部 tab 与外观控制，下面一个满屏面板；不属于任何一端的产品界面 */
  html, body { height: 100%; }
  body { margin: 0; display: grid; grid-template-rows: 60px minmax(0, 1fr); overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--font); }
  .hd { display: flex; align-items: center; gap: var(--s-5); padding: 0 var(--s-6); background: var(--surface); border-bottom: 1px solid var(--line); z-index: 20; }
  .hd__brand { display: flex; align-items: center; gap: var(--s-3); flex: none; }
  .hd__brand img { width: 32px; height: 32px; object-fit: contain; }
  .hd__brand h1 { font-size: var(--fs-lg); font-weight: 700; line-height: 1; white-space: nowrap; }
  .tabs[hidden] { display: none; }
  .tabs { display: inline-flex; gap: 2px; padding: 3px; border-radius: var(--r-full); background: var(--zone); flex: none; }
  .tabs__item { min-height: 34px; padding: 0 var(--s-5); border-radius: var(--r-full); font-size: var(--fs-md); font-weight: 500; color: var(--ink-2); transition: background var(--dur-quick) var(--ease-out), color var(--dur-quick) var(--ease-out); }
  .tabs__item[aria-selected="true"] { background: var(--action); color: var(--surface); font-weight: 600; }
  [data-ui-workbench] .tabs { border-radius: 12px; }
  [data-ui-workbench] :is(.tabs__item, .tool, .iconseg, .iconseg button) { border-radius: 8px; }
  .tools { display: flex; align-items: center; gap: var(--s-2); margin-left: auto; flex-wrap: nowrap; }
  .tool { display: inline-flex; align-items: center; gap: var(--s-2); min-height: 36px; padding: 0 var(--s-3); border-radius: var(--r-full); background: var(--zone); font-size: var(--fs-sm); font-weight: 500; color: var(--ink-2); white-space: nowrap; }
  .tool:hover, .pop[data-open="true"] > .tool { background: var(--action-edge); }
  .tool .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--action); box-shadow: 0 0 0 2px var(--surface), 0 0 0 3px var(--line-strong); }
  .tool .fx { width: 18px; height: 14px; border-radius: 4px; background: var(--action-edge); }
  .pop { position: relative; }
  .pop__panel { position: absolute; top: calc(100% + 8px); right: 0; display: none; padding: var(--s-4); background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--elev-3); border: 1px solid var(--line); z-index: 30; }
  .pop[data-open="true"] > .pop__panel { display: block; }
  .pop__title { font-size: var(--fs-sm); font-weight: 600; color: var(--ink-2); margin-bottom: var(--s-3); }
  .swatches { display: grid; grid-template-columns: repeat(8, 28px); gap: var(--s-2); }
  .swatch { width: 28px; height: 28px; border-radius: 50%; background: var(--c); box-shadow: inset 0 0 0 2px var(--surface), 0 0 0 1px var(--line-strong); transition: transform var(--dur-quick) var(--ease-out); }
  .swatch:hover { transform: scale(1.12); }
  .swatch[aria-pressed="true"] { box-shadow: inset 0 0 0 3px var(--surface), 0 0 0 2px var(--c); transform: scale(1.1); }
  .custom { display: flex; align-items: center; gap: var(--s-3); margin-top: var(--s-4); padding-top: var(--s-3); border-top: 1px solid var(--line); font-size: var(--fs-sm); color: var(--ink-2); }
  .custom input[type="color"] { width: 40px; height: 28px; padding: 0; border: 0; border-radius: var(--r-sm); background: none; cursor: pointer; }
  .custom code { font-size: var(--fs-xs); color: var(--ink-3); }
  .fxlist { display: grid; grid-template-columns: repeat(3, 92px); gap: var(--s-2); }
  .fxitem { display: grid; gap: var(--s-1); padding: var(--s-1); border-radius: var(--r-md); font-size: var(--fs-xs); color: var(--ink-2); text-align: center; }
  .fxitem__tile { height: 44px; border-radius: var(--r-sm); background-color: var(--action-tint); box-shadow: inset 0 0 0 1px var(--line); }
  .fxitem[aria-pressed="true"] { background: var(--action-tint); box-shadow: inset 0 0 0 1.5px var(--action); color: var(--action-press); font-weight: 600; }
  .iconseg { display: inline-flex; padding: 3px; gap: 2px; border-radius: var(--r-full); background: var(--zone); }
  .iconseg button { min-height: 30px; padding: 0 var(--s-3); border-radius: var(--r-full); font-size: var(--fs-sm); color: var(--ink-2); }
  .iconseg button[aria-pressed="true"] { background: var(--surface); color: var(--action-press); font-weight: 600; box-shadow: var(--elev-1); }
  .home { font-size: var(--fs-sm); color: var(--ink-2); padding: 0 var(--s-2); white-space: nowrap; }

  main { position: relative; min-height: 0; }
  .panel { position: absolute; inset: 0; visibility: hidden; pointer-events: none; }
  .panel[data-on="true"] { visibility: visible; pointer-events: auto; }
  .host { position: absolute; inset: 0; }
  .host iframe { display: block; width: 100%; height: 100%; border: 0; background: var(--bg); }

  /* 整页模板：页面列表 | 预览 | 本页逻辑 */
  .wb { display: grid; grid-template-columns: 208px minmax(0, 1fr) 328px; height: 100%; }
  .wb__side { overflow-y: auto; padding: var(--s-4) var(--s-2) var(--s-4) var(--s-4); }
  .wb__side h2 { margin: 0 var(--s-2) var(--s-2); font-size: var(--fs-xs); font-weight: 600; color: var(--ink-3); }
  .nav { display: grid; gap: 2px; }
  .nav__item { display: flex; align-items: center; justify-content: space-between; gap: var(--s-2); min-height: 40px; padding: 0 var(--s-3); border-radius: var(--r-md); text-align: left; font-size: var(--fs-md); color: var(--ink-2); }
  .nav__item:hover { background: var(--zone); }
  .nav__item[aria-current="true"] { background: var(--action-tint); color: var(--action-press); font-weight: 600; box-shadow: inset 0 0 0 1px var(--action-edge); }
  .nav__item small { font-size: var(--fs-xs); color: var(--ink-3); font-weight: 400; }
  .wb__stage { position: relative; display: grid; grid-template: minmax(0, 1fr) / minmax(0, 1fr); place-items: center; margin: var(--s-3) 0; border-radius: var(--r-xl); overflow: hidden; background: color-mix(in srgb, var(--action) 4%, var(--bg)); box-shadow: inset 0 0 0 1px var(--line); }
  .frame { position: relative; flex: none; overflow: hidden; background: var(--surface); box-shadow: var(--elev-3); }
  .frame iframe { display: block; width: 100%; height: 100%; border: 0; background: var(--bg); }
  .frame--phone { width: 410px; height: 864px; border-radius: 42px; border: 10px solid var(--ink); }
  .frame--desktop { width: 1440px; height: 900px; border-radius: var(--r-lg); border: 1px solid var(--line-strong); }
  .wb__info { overflow-y: auto; padding: var(--s-4) var(--s-5) var(--s-5) var(--s-3); }
  .wb__info h2 { margin: 0 0 var(--s-3); font-size: var(--fs-xl); font-weight: 700; line-height: var(--lh-tight); }
  .wb__info h3 { margin: var(--s-5) 0 var(--s-2); font-size: var(--fs-sm); font-weight: 600; color: var(--ink-2); }
  .kv { display: grid; gap: var(--s-3); padding: var(--s-4); margin: 0; background: var(--surface); border-radius: var(--r-lg); box-shadow: inset 0 0 0 1px var(--line); }
  .kv > div { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: var(--s-3); align-items: baseline; }
  .kv dt { font-size: var(--fs-sm); color: var(--ink-3); }
  .kv dd { margin: 0; font-size: var(--fs-md); line-height: 1.55; }
  .ids { display: grid; padding: var(--s-1); background: var(--surface); border-radius: var(--r-lg); box-shadow: inset 0 0 0 1px var(--line); }
  .ids button { display: flex; align-items: center; justify-content: space-between; gap: var(--s-2); min-height: 38px; padding: 0 var(--s-3); border-radius: var(--r-sm); text-align: left; font-size: var(--fs-md); }
  .ids button:hover { background: var(--zone); }
  .ids code { font-size: var(--fs-xs); font-weight: 600; font-variant-numeric: tabular-nums; color: var(--action-press); background: var(--zone); padding: 2px 8px; border-radius: var(--r-sm); }
  @media (max-width: 1180px) { .wb { grid-template-columns: 188px minmax(0, 1fr); } .wb__info { display: none; } }
  @media (max-width: 860px) { .hd { gap: var(--s-3); padding: 0 var(--s-3); } .hd__brand h1, .home, .tool span { display: none; } .wb { grid-template-columns: minmax(0, 1fr); } .wb__side { display: none; } }
</style>
</head>
<body>
<header class="hd bgfx">
  <div class="hd__brand"><img data-ic="bouquet" src="../../kit/assets/icons/flat/bouquet.webp" alt=""><h1>文件模板</h1></div>
  <nav class="tabs" id="tabs" hidden aria-label="模板分类"><button class="tabs__item" data-tab="docs" aria-selected="false">文件模板</button></nav>
  <div class="tools">
    <div class="pop" id="pop-theme"><button class="tool" aria-haspopup="true" aria-expanded="false"><i class="dot"></i><span>主题色</span></button>
      <div class="pop__panel"><p class="pop__title">主题色 24 种，或自选</p><div class="swatches" id="swatches"></div>
        <label class="custom"><span>自选</span><input type="color" id="custom" value="#a75f6d" aria-label="自选主题色"><code id="customhex">#A75F6D</code></label></div></div>
    <div class="pop" id="pop-bg"><button class="tool" aria-haspopup="true" aria-expanded="false"><i class="fx"></i><span>背景</span></button>
      <div class="pop__panel"><p class="pop__title">背景效果</p><div class="fxlist" id="fxlist"></div></div></div>
    <div class="iconseg" id="iconseg" role="group" aria-label="图标形态"><button data-icons="mono" aria-pressed="true">单色</button><button data-icons="flat" aria-pressed="false">彩色</button><button data-icons="3d" aria-pressed="false">立体</button><button data-icons="real" aria-pressed="false">真实</button></div>
    <a class="home" href="../../index.html">模板库首页</a>
  </div>
</header>
<main>
<section class="panel" id="panel-docs"><div class="host" data-src="docs" data-label="文件模板"></div></section>
</main>
<script type="text/html" id="src-docs"><!doctype html>
<html lang="zh-CN" data-ic-base="../../kit/assets/icons" data-icons="mono" data-bg="glow">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文件模板库</title>
<link rel="icon" href="../../kit/assets/solid/solid-content.webp">
<link rel="stylesheet" href="../../kit/tokens.css">
<link rel="stylesheet" href="../../kit/ui.css">
<link rel="stylesheet" href="../../kit/kit.css">
<link rel="stylesheet" href="../../kit/web.css">
<style>
  /* 文件模板库目录页：数据由 build_documents_index.py 内嵌；类名带 dx 前缀，不引用其它页面的样式 */
  body { background: var(--bg); }
  .dx { max-width: 1480px; margin: 0 auto; padding: 0 var(--s-6) var(--s-12); }

  /* 页面顶部：平面区，主题浅色渐变加花瓣纹理 */
  .dx-top { position: relative; isolation: isolate; margin: 0 calc(var(--s-6) * -1); padding: var(--s-6) var(--s-6) var(--s-5); background: linear-gradient(180deg, var(--action-tint) 0%, var(--bg) 100%); }
  .dx-row { display: flex; align-items: center; justify-content: space-between; gap: var(--s-4); flex-wrap: wrap; }
  .dx-brand { display: flex; align-items: center; gap: var(--s-3); }
  .dx-brand img { width: 44px; height: 44px; object-fit: contain; }
  .dx-brand h1 { font-size: var(--fs-3xl); font-weight: 700; line-height: var(--lh-tight); white-space: nowrap; }
  .dx-tools { display: flex; align-items: center; gap: var(--s-5); flex-wrap: wrap; }
  .dx-tools .search { width: 340px; max-width: 100%; }
  .dx-swatches { display: flex; gap: var(--s-2); }
  .dx-swatch { width: 28px; height: 28px; border-radius: 50%; background: var(--action); box-shadow: inset 0 0 0 2px var(--surface), 0 0 0 1px var(--line-strong); transition: transform var(--dur-quick) var(--ease-out); }
  .dx-swatch[aria-pressed="true"] { box-shadow: inset 0 0 0 3px var(--surface), 0 0 0 2px var(--action); transform: scale(1.1); }

  /* 模块标题放在卡片外上方，左对齐 */
  .dx-mod { margin-top: var(--s-8); }
  .dx-mod__head { display: flex; align-items: baseline; gap: var(--s-3); padding: 0 var(--s-1); }
  .dx-mod__head h2 { font-size: var(--fs-xl); font-weight: 700; line-height: var(--lh-tight); }
  .dx-mod__head span { font-size: var(--fs-sm); color: var(--ink-3); }
  .dx-mod__body { margin-top: var(--s-4); }

  /* 命名规则与目录结构 */
  .dx-rules { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: var(--s-6); align-items: start; }
  .dx-rules > div { min-width: 0; }
  .dx-rules .dx-mod { margin-top: var(--s-6); }
  .dx-table { table-layout: auto; }
  .dx-table td, .dx-table th { white-space: nowrap; }
  .dx-table td.t-wrap { white-space: normal; overflow: visible; }
  .dx-kind { display: inline-flex; align-items: center; gap: var(--s-2); font-weight: 600; vertical-align: middle; line-height: 1; }
  .dx-kind img { width: 28px; height: 28px; object-fit: contain; flex: none; }
  .dx-tree { padding: var(--s-5); font-size: var(--fs-md); color: var(--ink-2); }
  .dx-tree ul { margin-left: var(--s-5); padding-left: var(--s-4); border-left: 1px solid var(--line-strong); }
  .dx-tree li { position: relative; padding: 3px 0; line-height: 1.6; }
  .dx-tree ul li::before { content: ""; position: absolute; left: calc(var(--s-4) * -1); top: 15px; width: var(--s-3); border-top: 1px solid var(--line-strong); }
  .dx-tree b { color: var(--ink); font-weight: 600; }
  .dx-dirs { display: inline-flex; flex-wrap: wrap; gap: var(--s-1) var(--s-3); }
  .dx-tree small { margin-left: var(--s-2); font-size: var(--fs-sm); color: var(--ink-3); }

  /* 类型标签 */
  .dx-pills { display: flex; gap: var(--s-2); overflow-x: auto; padding: var(--s-6) 2px var(--s-2); scrollbar-width: none; }
  .dx-pills::-webkit-scrollbar { display: none; }
  .dx-pill { flex: none; display: inline-flex; align-items: center; gap: var(--s-2); min-height: 40px; padding: 0 var(--s-4); border-radius: var(--r-full); background: var(--surface); box-shadow: var(--elev-1); font-size: var(--fs-md); font-weight: 500; color: var(--ink-2); transition: background var(--dur-quick) var(--ease-out), color var(--dur-quick) var(--ease-out); }
  .dx-pill small { font-size: var(--fs-xs); font-weight: 600; padding: 1px 7px; border-radius: var(--r-full); background: var(--zone); color: var(--ink-2); }
  .dx-pill[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .dx-pill[aria-pressed="true"] small { background: rgba(255, 255, 255, .2); color: var(--bg); }
  .dx-count { margin-left: auto; align-self: center; font-size: var(--fs-sm); color: var(--ink-3); white-space: nowrap; }

  /* 模板卡 */
  .dx-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(400px, 100%), 1fr)); gap: var(--s-4); align-items: start; }
  .dx-grid--originals { align-items: stretch; }
  .dx-card { display: flex; flex-direction: column; gap: var(--s-3); padding: var(--s-4); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--elev-1); scroll-margin-top: var(--s-6); }
  .dx-card:target { box-shadow: 0 0 0 2px var(--action), var(--elev-2); }
  .dx-thumb { display: grid; place-items: center; aspect-ratio: 16 / 9; border-radius: var(--r-md); overflow: hidden; background: var(--action-tint); border: 1px solid var(--line); }
  .dx-thumb .dx-pv { width: 100%; height: 100%; object-fit: cover; }
  .dx-thumb .dx-ic { width: 72px; height: 72px; object-fit: contain; }
  .dx-card__head { display: flex; align-items: center; gap: var(--s-3); }
  .dx-card__head > img { width: 40px; height: 40px; object-fit: contain; flex: none; }
  .dx-card__head h3 { flex: 1; min-width: 0; font-size: var(--fs-lg); font-weight: 600; line-height: var(--lh-tight); }
  .dx-copy { flex: none; min-height: 28px; padding: 0 var(--s-2); border-radius: var(--r-sm); background: var(--zone); color: var(--action-press); font-size: var(--fs-xs); font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: .02em; transition: background var(--dur-quick) var(--ease-out); }
  .dx-copy:hover { background: var(--action-edge); }
  .dx-use { min-height: calc(var(--fs-sm) * 3.2); font-size: var(--fs-sm); color: var(--ink-2); line-height: 1.6; }
  .dx-grid--originals .dx-use { min-height: 0; }
  .dx-links { display: flex; align-items: center; gap: var(--s-2); margin-top: auto; padding-top: var(--s-1); }
  .dx-original-meta { color: var(--ink-3); font-size: var(--fs-xs); line-height: 1.5; }
  .dx-original-links { flex-wrap: wrap; }
  .dx-cmd { border-top: 1px solid var(--line); padding-top: var(--s-2); }
  .dx-cmd summary { display: flex; align-items: center; justify-content: space-between; min-height: 36px; font-size: var(--fs-sm); font-weight: 600; color: var(--ink-2); cursor: pointer; list-style: none; }
  .dx-cmd summary::-webkit-details-marker { display: none; }
  .dx-cmd[open] .chev::after { transform: rotate(45deg); }
  .dx-cmd__body { display: grid; gap: var(--s-2); padding-bottom: var(--s-1); }
  .dx-cmd__row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: start; gap: var(--s-2); padding: var(--s-2) var(--s-3); background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-md); }
  .dx-cmd__lab { font-size: var(--fs-xs); font-weight: 600; color: var(--action-press); line-height: 28px; white-space: nowrap; }
  .dx-cmd__row code { font: inherit; font-size: var(--fs-sm); color: var(--ink); line-height: 1.6; white-space: pre-wrap; word-break: break-all; padding-top: 2px; }

  /* 复用块表 */
  .dx-parts td.t-l { padding-left: var(--s-5); }
  .dx-chips { display: flex; flex-wrap: wrap; gap: var(--s-1) var(--s-2); }
  .dx-chips a { display: inline-flex; align-items: center; height: 24px; padding: 0 var(--s-2); border-radius: var(--r-sm); background: var(--action-tint); color: var(--action-press); font-size: var(--fs-xs); font-weight: 600; font-variant-numeric: tabular-nums; transition: background var(--dur-quick) var(--ease-out); }
  .dx-chips a:hover { background: var(--action-edge); }
  .dx-parts td.dx-type { background: var(--bg); }

  .dx-empty { display: none; margin-top: var(--s-8); }
  .dx-empty.on { display: grid; }

  @media (max-width: 1000px) { .dx-rules { grid-template-columns: minmax(0, 1fr); gap: 0; } }
  @media (max-width: 760px) { .dx { padding: 0 var(--s-4) var(--s-8); } .dx-top { margin: 0 calc(var(--s-4) * -1); padding: var(--s-4); } .dx-brand h1 { font-size: var(--fs-2xl); } .dx-tools { width: 100%; } .dx-tools .search { width: 100%; } }
</style>
</head>
<body>
<div class="dx">
  <header class="dx-top bgfx">
    <div class="dx-row">
      <div class="dx-brand"><img data-ic="bouquet" src="../../kit/assets/icons/flat/bouquet.webp" alt=""><h1>文件模板库</h1></div>
      <div class="dx-tools">
        <label class="search"><img src="../../kit/assets/line/search.webp" alt=""><input id="q" type="search" placeholder="搜索编号、名称或用途" aria-label="搜索编号、名称或用途"></label>
      </div>
    </div>
  </header>

  <section class="dx-rules" aria-label="命名规则与目录结构">
    <div class="dx-mod">
      <div class="dx-mod__head"><h2>命名规则</h2></div>
      <div class="dx-mod__body card card--flat">
        <div class="table-wrap">
          <table class="table table--static dx-table">
            <thead><tr><th>类型</th><th>编号</th><th>文件名</th><th>目录</th></tr></thead>
            <tbody id="rules"></tbody>
          </table>
        </div>
      </div>
    </div>
    <div class="dx-mod">
      <div class="dx-mod__head"><h2>目录结构</h2></div>
      <div class="dx-mod__body card card--flat">
        <ul class="dx-tree">
          <li><b>templates/documents/</b>
            <ul>
              <li>index.html<small>本页</small></li>
              <li>documents.html<small>目录页</small></li>
              <li>README.md</li>
              <li><span class="dx-dirs"><b>word/</b><b>excel/</b><b>slides/</b><b>pdf/</b><b>reading/</b></span>
                <ul>
                  <li>README.md</li>
                  <li>manifest.json<small>登记表</small></li>
                  <li>specs/<small>描述文件</small></li>
                  <li>specs/parts/<small>可复用块</small></li>
                  <li>samples/<small>样例文件</small></li>
                  <li>slides/originals/<small>PPT 原版、预览和授权</small></li>
                  <li>tools/<small>补充脚本</small></li>
                </ul>
              </li>
            </ul>
          </li>
        </ul>
      </div>
    </div>

<script>
  (function () {
    const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
    const ORDER = ['word', 'excel', 'slides', 'pdf', 'reading'];
    const META = {
      word: { title: '文字文档', code: 'WD', icon: 'biz-notes' },
      excel: { title: '表格文件', code: 'XL', icon: 'layout' },
      slides: { title: 'PPT', code: 'SL', icon: 'biz-demo' },
      pdf: { title: 'PDF', code: 'PD', icon: 'biz-review' },
      reading: { title: '阅读网页', code: 'RD', icon: 'solid-content' }
    };
    const types = ((window.LZ_DOCS && window.LZ_DOCS.types) || []).slice().sort((a, b) => ORDER.indexOf(a.type) - ORDER.indexOf(b.type));
    const hash = window.frameElement ? window.parent.location.hash : location.hash;
    const state = { cat: hash === '#ppt' ? 'slides' : 'all', q: '' };
    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const url = (t, p) => [t.dir, ...p.split('/')].map(encodeURIComponent).join('/');
    const icon = t => `../../kit/assets/solid/${(META[t.type] || META.word).icon}.webp`;
    const label = t => t.title || (META[t.type] || {}).title || t.type;
    const nameOf = (t, id) => { const hit = t.items.find(i => i.id === id); return hit ? hit.name : id; };

    // 命名规则表：每类一行
    $('#rules').innerHTML = ORDER.map(k => {
      const t = types.find(x => x.type === k), m = META[k];
      const typeIcon = `<img src="../../kit/assets/solid/${m.icon}.webp" alt="">`;
      const naming = t ? t.naming : 'DC-' + m.code + '-三位序号-中文名';
      const head = `<tr><td class="t-l"><span class="dx-kind">${typeIcon}${esc(t ? label(t) : m.title)}</span></td>`;
      const rule = t?.originals?.length
        ? '<td>DC-SL-ONNN</td><td>发布方原文件名</td><td>slides/originals/</td>'
        : `<td>DC-${m.code}-NNN</td><td>${esc(naming)}</td><td>${esc(k)}/</td>`;
      return head + rule + '</tr>';
    }).join('');

    // 类型标签
    const hasOriginals = t => Boolean(t.originals?.length);
    const countTemplates = t => hasOriginals(t) ? t.originals.length : t.items.length;
    const catalogParts = t => hasOriginals(t) ? [] : t.parts;
    const total = types.reduce((n, t) => n + countTemplates(t), 0), totalParts = types.reduce((n, t) => n + catalogParts(t).length, 0);
    const pill = (type, title, count) => `<button class="dx-pill" data-cat="${esc(type)}" aria-pressed="${state.cat === type}">${esc(title)}<small>${count}</small></button>`;
    $('#pills').innerHTML = pill('all', '全部', total) + types.map(t => pill(t.type, label(t), countTemplates(t))).join('');

    const match = (text) => !state.q.trim() || text.toLowerCase().includes(state.q.trim().toLowerCase());

    function cardHTML(t, it) {
      const thumb = it.preview ? `<div class="dx-thumb"><img class="dx-pv" src="${esc(url(t, it.preview))}" alt="${esc(it.name)}样例"></div>` : '';
      const lead = it.preview ? '' : `<img src="${icon(t)}" alt="">`;
      const checks = (Array.isArray(it.checks) ? it.checks : [it.checks]).filter(Boolean);
      const row = (lab, cmd) => `<div class="dx-cmd__row"><span class="dx-cmd__lab">${lab}</span><code>${esc(cmd)}</code><button class="btn btn--text btn--sm" data-copy="${esc(cmd)}" aria-label="复制${lab}命令">复制</button></div>`;
      return `<article class="dx-card" id="${esc(it.id)}" aria-label="${esc(it.name)}">
        ${thumb}
        <div class="dx-card__head">${lead}<h3 class="one-line">${esc(it.name)}</h3><button class="dx-copy" data-copy="${esc(it.id)}" aria-label="复制编号 ${esc(it.id)}">${esc(it.id)}</button></div>
        <p class="dx-use">${esc(it.use)}</p>
        <div class="dx-links">
          <a class="btn btn--secondary btn--sm" href="${esc(url(t, it.file))}" target="_blank" rel="noopener">样例文件</a>
          <a class="btn btn--text btn--sm" href="${esc(url(t, it.spec))}" target="_blank" rel="noopener">描述文件</a>
        </div>
        <details class="dx-cmd"><summary>生成与检查命令<span class="chev"></span></summary>
          <div class="dx-cmd__body">${row('生成', it.generator)}${checks.map(c => row('检查', c)).join('')}</div>
        </details>
      </article>`;
    }

    function originalCard(t, it, index) {
      const thumb = it.preview ? `<div class="dx-thumb"><img class="dx-pv" width="800" height="450" loading="${index < 3 ? 'eager' : 'lazy'}" decoding="async" src="${esc(url(t, it.preview))}" alt="${esc(it.name)}原版页面预览"></div>` : '';
      const lead = thumb ? '' : `<img src="${icon(t)}" alt="">`;
      const specs = [it.category, it.extension, it.ratio, `${it.slides} 页`].join(' · ');
      const license = it.publisher;
      const download = it.local ? `<a class="btn btn--secondary btn--sm" href="${esc(url(t, it.file))}" download="${esc(it.original_name)}">下载原版</a>` : '';
      const sourceLabel = it.local ? '发布页' : '去发布页下载';
      return `<article class="dx-card" id="${esc(it.id)}" aria-label="${esc(it.name)}">
        ${thumb}
        <div class="dx-card__head">${lead}<h3>${esc(it.name)}</h3><button class="dx-copy" data-copy="${esc(it.id)}" aria-label="复制编号 ${esc(it.id)}">${esc(it.id)}</button></div>
        <p class="dx-original-meta">${esc(specs)}</p>
        <p class="dx-use">${esc(it.use)}</p>
        <p class="dx-original-meta">${esc(license.name)} · ${esc(license.credits)}</p>
        <div class="dx-links dx-original-links">
          ${download}
          <a class="btn ${it.local ? 'btn--text' : 'btn--secondary'} btn--sm" href="${esc(it.source)}" target="_blank" rel="noopener">${sourceLabel}</a>
          <a class="btn btn--text btn--sm" href="${esc(license.license_url)}" target="_blank" rel="noopener">授权</a>
        </div>
      </article>`;
    }

    function draw() {
      let shown = 0, html = '';
      const rows = [];
      types.forEach(t => {
        if (state.cat !== 'all' && state.cat !== t.type) return;
        const originals = (t.originals || []).filter(i => match([i.id, i.name, i.use, i.category, label(t), i.extension, i.publisher.name].join(' ')));
        if (originals.length) {
          shown += originals.length;
          html += `<section class="dx-mod" data-cat="${esc(t.type)}" aria-label="PPT 原版模板"><div class="dx-mod__head"><h2>PPT 原版模板</h2></div><div class="dx-mod__body dx-grid dx-grid--originals">${originals.map((i, index) => originalCard(t, i, index)).join('')}</div></section>`;
        }
        const items = hasOriginals(t) ? [] : t.items.filter(i => match([i.id, i.name, i.use, label(t)].join(' ')));
        if (items.length) {
          shown += items.length;
          const heading = t.type === 'slides' ? 'PPT 生成样例' : label(t);
          html += `<section class="dx-mod" data-cat="${esc(t.type)}" aria-label="${esc(heading)}"><div class="dx-mod__head"><h2>${esc(heading)}</h2><span>${items.length} 个模板</span></div><div class="dx-mod__body dx-grid">${items.map(i => cardHTML(t, i)).join('')}</div></section>`;
        }
        const parts = catalogParts(t).filter(p => match([p.id, p.name, label(t)].concat((p.used_in || []).map(u => u + ' ' + nameOf(t, u))).join(' ')));
        if (parts.length) rows.push({ t, parts });
      });
      $('#cats').innerHTML = html;
      const n = rows.reduce((s, r) => s + r.parts.length, 0);
      $('#parts').hidden = n === 0;
      $('#partcount').textContent = n + ' 个';
      $('#partrows').innerHTML = rows.map(({ t, parts }) => parts.map((p, i) =>
        `<tr>${i === 0 ? `<td class="dx-type" rowspan="${parts.length}"><span class="dx-kind"><img src="${icon(t)}" alt="">${esc(label(t))}</span></td>` : ''}` +
        `<td><button class="dx-copy" data-copy="${esc(p.id)}" aria-label="复制编号 ${esc(p.id)}">${esc(p.id)}</button></td>` +
        `<td>${esc(p.name)}</td>` +
        `<td class="t-l t-wrap"><div class="dx-chips">${(p.used_in || []).map(u => `<a href="#${esc(u)}" data-tip="${esc(nameOf(t, u))}" data-go="${esc(t.type)}">${esc(u)}</a>`).join('')}</div></td></tr>`).join('')).join('');
      $('#count').textContent = state.cat === 'all' && !state.q.trim() ? `${total} 个模板　${totalParts} 个复用块` : `${shown} 个模板`;
      const none = shown === 0 && n === 0;
      $('#emptytext').textContent = types.length === 0 || total === 0 ? '还没有登记的模板' : '没有匹配的模板';
      $('#empty').classList.toggle('on', none);
    }

    async function copy(text) {
      try { await navigator.clipboard.writeText(text); }
      catch (e) {
        const a = document.createElement('textarea'); a.value = text; a.style.position = 'fixed'; a.style.opacity = '0'; document.body.appendChild(a); a.select();
        const ok = document.execCommand('copy'); a.remove(); if (!ok) throw e;
      }
    }
    document.addEventListener('click', async e => {
      const b = e.target.closest('[data-copy]');
      if (b) { try { await copy(b.dataset.copy); Lz.toast('已复制 ' + (b.dataset.copy.length > 24 ? '命令' : b.dataset.copy), 'success'); } catch (err) { Lz.toast('复制失败', 'danger'); } return; }
      const go = e.target.closest('[data-go]');
      if (go) { // 复用块指向的模板可能被类型标签或搜索隐藏，先放开再跳转
        e.preventDefault(); const id = go.getAttribute('href').slice(1);
        if (!document.getElementById(id)) { state.cat = 'all'; state.q = ''; $('#q').value = ''; $$('.dx-pill').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.cat === 'all'))); draw(); }
        const el = document.getElementById(id); if (el) { location.hash = id; el.scrollIntoView({ behavior: Lz.reduce ? 'auto' : 'smooth', block: 'center' }); }
      }
    });
    $('#pills').addEventListener('click', e => { const b = e.target.closest('.dx-pill'); if (!b) return; $$('.dx-pill').forEach(x => x.setAttribute('aria-pressed', String(x === b))); state.cat = b.dataset.cat; draw(); });
    $('#q').addEventListener('input', e => { state.q = e.target.value; draw(); });
    draw();
  })();
<\/script>

</script>

<script>
(function () {
  const CFG = {"key": "documents", "theme": "rose", "tabs": ["docs"], "presets": [{"id": "rose", "name": "玫瑰", "action": "#A75F6D"}, {"id": "wine", "name": "酒红", "action": "#7E2C41"}, {"id": "coral", "name": "珊瑚", "action": "#AB6056"}, {"id": "terracotta", "name": "赤陶", "action": "#A26548"}, {"id": "amber", "name": "琥珀", "action": "#9B6B33"}, {"id": "sand", "name": "沙金", "action": "#87723E"}, {"id": "olive", "name": "橄榄", "action": "#74783E"}, {"id": "sage", "name": "鼠尾草", "action": "#637B63"}, {"id": "green", "name": "草绿", "action": "#458250"}, {"id": "pine", "name": "松绿", "action": "#31715B"}, {"id": "teal", "name": "青碧", "action": "#2B8181"}, {"id": "cyan", "name": "湖蓝", "action": "#307E98"}, {"id": "sky", "name": "天蓝", "action": "#3D79AB"}, {"id": "blue", "name": "靛蓝", "action": "#5373BC"}, {"id": "navy", "name": "藏青", "action": "#33476D"}, {"id": "indigo", "name": "靛紫", "action": "#716CBB"}, {"id": "purple", "name": "紫藤", "action": "#8069A9"}, {"id": "mauve", "name": "雾紫", "action": "#876C8D"}, {"id": "plum", "name": "梅紫", "action": "#9F608A"}, {"id": "graphite", "name": "石墨", "action": "#4E5359"}, {"id": "slate", "name": "岩灰", "action": "#536672"}, {"id": "stone", "name": "暖灰", "action": "#696259"}, {"id": "mocha", "name": "摩卡", "action": "#6A5243"}, {"id": "ink", "name": "墨黑", "action": "#222429"}], "effects": [{"id": "glow", "name": "柔光"}, {"id": "none", "name": "无"}, {"id": "dots", "name": "点阵"}, {"id": "grid", "name": "网格"}, {"id": "lines", "name": "斜纹"}, {"id": "rings", "name": "同心圆"}, {"id": "petal", "name": "花瓣"}, {"id": "leaf", "name": "叶片"}, {"id": "wave", "name": "波纹"}]};
  const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const state = { theme: CFG.theme, color: null, bg: CFG.background || 'glow', icons: 'mono' };
  const frames = new Set();
  const store = { get(k) { try { return localStorage.getItem('lz-bundle-' + k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem('lz-bundle-' + k, v); } catch (e) { /* 浏览器不让存时只是不记住 */ } } };
  const q = new URLSearchParams(location.search);
  const skinKeys = ['theme', 'bg', 'icons', 'color'];
  const skinKey = k => CFG.workbench ? 'frontend-' + k : k;
  const oldDefaults = { theme: 'rose', bg: 'glow', icons: 'mono', color: '' };
  skinKeys.forEach(k => {
    const legacy = store.get(k);
    const saved = store.get(skinKey(k)) ?? (legacy === oldDefaults[k] ? null : legacy);
    const value = q.get(k) || saved;
    if (value) state[k] = value;
  });
  if (state.color) state.theme = null;

  function send(win) { try { win.postMessage({ lz: 'skin', theme: state.theme || undefined, color: state.color || undefined, bg: state.bg, icons: state.icons }, '*'); } catch (e) { /* 框还没准备好 */ } }
  function apply() {
    Lz.skin({ theme: state.theme || undefined, color: state.color || undefined, bg: state.bg, icons: state.icons });
    frames.forEach(f => f.contentWindow && send(f.contentWindow));
    $$('#swatches .swatch').forEach(b => b.setAttribute('aria-pressed', String(!state.color && b.dataset.theme === state.theme)));
    $$('#fxlist .fxitem').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.bg === state.bg)));
    $$('#iconseg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.icons === state.icons)));
    skinKeys.forEach(k => store.set(skinKey(k), state[k] || ''));
  }
  function mount(host, html, cls) {
    const f = document.createElement('iframe'); f.setAttribute('aria-label', host.dataset.label || '预览');
    f.addEventListener('load', () => { frames.add(f); send(f.contentWindow); });
    f.srcdoc = html; host.appendChild(f); return f;
  }
  const source = id => ($('#src-' + id).textContent || '').replace(/<\\\/script/g, '</script');

  // 外观控制
  $('#swatches').innerHTML = CFG.presets.map(p => `<button class="swatch" style="--c:${p.action}" data-theme="${p.id}" aria-pressed="false" aria-label="${p.name}" data-tip="${p.name}"></button>`).join('');
  $('#fxlist').innerHTML = CFG.effects.map(e => `<button class="fxitem" data-bg="${e.id}" aria-pressed="false"><span class="fxitem__tile bgfx bgfx--${e.id}" ${e.id === 'none' ? '' : ''}></span>${e.name}</button>`).join('');
  $('#swatches').addEventListener('click', e => { const b = e.target.closest('.swatch'); if (!b) return; state.theme = b.dataset.theme; state.color = null; apply(); });
  $('#custom').addEventListener('input', e => { state.color = e.target.value; state.theme = null; $('#customhex').textContent = e.target.value.toUpperCase(); apply(); });
  $('#fxlist').addEventListener('click', e => { const b = e.target.closest('.fxitem'); if (!b) return; state.bg = b.dataset.bg; apply(); });
  $('#iconseg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; state.icons = b.dataset.icons; apply(); });
  $$('.pop').forEach(p => p.firstElementChild.addEventListener('click', e => { e.stopPropagation(); const open = p.dataset.open !== 'true'; $$('.pop').forEach(x => { x.dataset.open = 'false'; x.firstElementChild.setAttribute('aria-expanded', 'false'); }); p.dataset.open = String(open); p.firstElementChild.setAttribute('aria-expanded', String(open)); }));
  document.addEventListener('click', e => { if (!e.target.closest('.pop__panel')) $$('.pop').forEach(x => { x.dataset.open = 'false'; x.firstElementChild.setAttribute('aria-expanded', 'false'); }); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') $$('.pop').forEach(x => { x.dataset.open = 'false'; }); });

  // tab
  const mounted = {};
  function openTab(id) {
    $$('#tabs .tabs__item').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === id)));
    $$('.panel').forEach(p => { p.dataset.on = String(p.id === 'panel-' + id); });
    if (!mounted[id]) { mounted[id] = true; const host = $('#panel-' + id + ' .host'); if (host) mount(host, source(host.dataset.src)); else if (id === CFG.workbench) openPage(page); }
    store.set('tab-' + CFG.key, id); fit();
  }
  $('#tabs').addEventListener('click', e => { const b = e.target.closest('.tabs__item'); if (b) openTab(b.dataset.tab); });

  // 整页模板工作台
  let page = CFG.pages && CFG.pages[0] ? CFG.pages[0].id : null, pageFrame = null;
  const frame = $('#frame');
  function fit() {
    const stage = $('.wb__stage'); if (!stage || !frame || !stage.clientWidth) return;
    if (CFG.device === 'phone') {
      const k = Math.min(1, (stage.clientHeight - 28) / 864, (stage.clientWidth - 28) / 410);
      frame.style.transform = 'scale(' + k + ')';
    } else { // 桌面：宽按 1440 缩放，高度随舞台补满，页面按真实窗口比例显示
      const k = Math.min(1, (stage.clientWidth - 28) / 1440);
      frame.style.height = Math.floor((stage.clientHeight - 28) / k) + 'px'; frame.style.transform = 'scale(' + k + ')';
    }
    frame.style.transformOrigin = 'center center';
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
  function openPage(id) {
    page = id; const p = CFG.pages.find(x => x.id === id);
    $$('#nav .nav__item').forEach(b => b.setAttribute('aria-current', String(b.dataset.page === id)));
    if (pageFrame) { frames.delete(pageFrame); pageFrame.remove(); }
    pageFrame = mount(frame, source('page-' + id));
    $('#info').innerHTML = `<h2>${esc(p.name)}</h2><h3>本页逻辑</h3><dl class="kv">${p.logic.map(([k, v]) => `<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl><h3>本页组件编号</h3><div class="ids">${p.ids.map(c => `<button data-copy="${c.id}"><span>${esc(c.name)}</span><code>${c.id}</code></button>`).join('')}</div>`;
    fit();
  }
  if (frame) {
    $('#nav').innerHTML = '<h2>完整页面</h2>' + CFG.pages.map(p => `<button class="nav__item" data-page="${p.id}" aria-current="false"><span>${esc(p.name)}</span><small>${p.ids.length} 块</small></button>`).join('');
    $('#nav').addEventListener('click', e => { const b = e.target.closest('[data-page]'); if (b) openPage(b.dataset.page); });
    $('#info').addEventListener('click', async e => { const b = e.target.closest('[data-copy]'); if (!b) return; try { await navigator.clipboard.writeText(b.dataset.copy); Lz.toast('已复制 ' + b.dataset.copy, 'success'); } catch (err) { Lz.toast('复制失败', 'danger'); } });
    addEventListener('message', e => { if (e.data && e.data.lz === 'goto' && CFG.pages.some(p => p.id === e.data.page)) { openTab(CFG.workbench); openPage(e.data.page); } });
    addEventListener('resize', fit);
  }
  // 海报墙：缩放预览，点击在新页打开原文件
  $$('.wall').forEach(w => { const f = $('iframe', w); });

  apply();
  openTab(store.get('tab-' + CFG.key) && CFG.tabs.includes(store.get('tab-' + CFG.key)) ? store.get('tab-' + CFG.key) : CFG.tabs[0]);
})();
</script>
</body>
</html>
