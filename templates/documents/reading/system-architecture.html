<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{SYSTEM_NAME}}</title>
<link rel="icon" href="{{TAB_ICON}}">
<style>
:root{color-scheme:light;--canvas:#fff;--surface:#f8fafc;--ink:#172033;--muted:#526071;--line:#d9e2eb;--accent:#245b83}
*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font-family:"PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif}
/* luz-md-type:start
   阅读型网页的 Markdown 层级（母本：Luz-Design/references/md-type.css）。其他技能的样式文件里夹着同一段，
   改这里之后运行 py -X utf8 scripts/sync_md_type.py --write 同步，不要在别处手改（不带参数运行只报告 SAME 或 DIFF）。
   规则见 file-design.html 网页文件 › 排版参数（逐级数值表）与 visual-design.html 一 › 字体与字号 › 字阶表的阅读型网页一行：手机（小于 768）与桌面（768 及以上）各一套字号，
   桌面正文 18，手机 16；每一级的字号、字重、行高、上下留白固定，页面只取这些级别，不另造样式。
   只管文字层级，不管容器宽度、颜色主题与组件：颜色取页面已有的变量，缺省用下面的回退值。 */
:root {
  --md-body: 16px;  --md-body-lh: 1.75;
  --md-h1: 28px;  --md-h2: 24px;  --md-h3: 20px;  --md-h4: 16px;  --md-h5: 14px;  --md-h6: 14px;
  --md-table: 14px;  --md-aux: 14px;  --md-code: 14px;
  --md-measure: 42em;
}
@media (min-width: 768px) {
  :root {
    --md-body: 18px;  --md-body-lh: 1.8;
    --md-h1: 36px;  --md-h2: 28px;  --md-h3: 22px;  --md-h4: 18px;  --md-h5: 16px;  --md-h6: 14px;
    --md-table: 16px;  --md-aux: 14px;  --md-code: 16px;
  }
}
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { font-size: var(--md-body); line-height: var(--md-body-lh); font-weight: 400; font-kerning: normal; text-rendering: optimizeLegibility; overflow-wrap: break-word; }
h1, h2, h3, h4, h5, h6 { font-family: inherit; font-style: normal; letter-spacing: 0; text-wrap: balance; }
h1 { margin: 0 0 24px; font-size: var(--md-h1); line-height: 1.25; font-weight: 700; }
h2 { margin: 56px 0 16px; padding-bottom: 12px; border-bottom: 1px solid var(--line, #d7e0e8); font-size: var(--md-h2); line-height: 1.3; font-weight: 700; }
h3 { margin: 40px 0 12px; font-size: var(--md-h3); line-height: 1.4; font-weight: 600; }
h4 { margin: 28px 0 8px; font-size: var(--md-h4); line-height: 1.5; font-weight: 600; }
h5 { margin: 24px 0 8px; font-size: var(--md-h5); line-height: 1.5; font-weight: 600; color: var(--muted, var(--ink-2, #526071)); }
h6 { margin: 20px 0 8px; font-size: var(--md-h6); line-height: 1.5; font-weight: 600; color: var(--muted, var(--ink-2, #526071)); }
p { margin: 0 0 16px; }
p, ul, ol, dl, blockquote { max-width: var(--md-measure); }
ul, ol { margin: 0 0 16px; padding-left: 1.6em; }
li { margin: 0; }
li + li { margin-top: 6px; }
li > ul, li > ol { margin: 6px 0 0; }
ul { list-style: disc; }
ul ul { list-style: circle; }
ul ul ul { list-style: square; }
li::marker { color: var(--muted, var(--ink-2, #526071)); }
dt { font-weight: 600; }
dd { margin: 2px 0 12px; padding-left: 1em; }
strong, b { font-weight: 600; }
em, i, cite, address { font-style: normal; font-weight: 600; }
blockquote { margin: 0 0 16px; padding: 4px 0 4px 16px; border-left: 4px solid var(--line, #d7e0e8); color: var(--muted, var(--ink-2, #526071)); }
blockquote > :last-child { margin-bottom: 0; }
hr { margin: 40px 0; border: 0; border-top: 1px solid var(--line, #d7e0e8); }
small, figcaption, caption, time, .aux, .src { font-size: var(--md-aux); line-height: 1.6; }
caption, figcaption { margin: 0; padding: 0 0 10px; color: var(--muted, var(--ink-2, #526071)); text-align: center; }
caption { caption-side: top; }
table { font-size: var(--md-table); line-height: 1.65; font-variant-numeric: tabular-nums; }
th { font-weight: 600; }
td > :last-child, th > :last-child { margin-bottom: 0; }
code, kbd, samp, pre { font-family: "Cascadia Mono", "Consolas", "Microsoft YaHei", monospace; font-size: var(--md-code); line-height: 1.6; }
code, kbd, samp { padding: 2px 6px; border-radius: 8px; background: var(--surface-soft, var(--surface-2, #edf3f7)); overflow-wrap: anywhere; }
pre { margin: 0 0 16px; padding: 16px 20px; overflow: auto; border: 1px solid var(--line, #d7e0e8); border-radius: 8px; background: var(--surface, #f7f9fc); }
pre code { padding: 0; border-radius: 0; background: none; font-size: inherit; }
@media print {
  :root { --md-body: 11pt; --md-body-lh: 1.7; --md-h1: 22pt; --md-h2: 17pt; --md-h3: 14pt; --md-h4: 12pt; --md-h5: 11pt; --md-h6: 10.5pt; --md-table: 10.5pt; --md-aux: 10.5pt; --md-code: 10.5pt; }
}
/* luz-md-type:end */
main{width:min(1180px,calc(100% - 40px));margin:0 auto;padding:44px 0 72px}h2{margin:0 0 14px;padding-bottom:0;border-bottom:0}h3{margin-top:20px}section{margin:0 0 22px;padding:22px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:10px;border:1px solid var(--line);text-align:left}th{background:#eef4f8}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.node{padding:12px;border:1px solid var(--line);border-radius:8px;background:#fff}@media(max-width:720px){main{width:min(100% - 28px,1180px);padding-top:28px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main data-artifact="system-architecture">
<h1>{{SYSTEM_NAME}}</h1>
<section id="scope"><h2>范围与角色权限</h2><div class="grid"><div class="node" data-role-id="R-001">角色</div></div></section>
<section id="functions"><h2>模块与功能</h2><div class="node" data-function-id="F-001" data-module="{{MODULE}}" data-source="用户要求" data-req-ids="REQ-001">功能</div></section>
<section id="pages"><h2>页面与路由</h2><div class="node" data-page-id="P-001" data-route="/home" data-function-ids="F-001" data-entry="N-001" data-goal="用户在本页完成的一件事" data-primary-action="A-001" data-secondary-actions="" data-exit="返回:来源;完成:P-001" data-states="加载:骨架与真实内容同形;空:写对象并给一个行动 A-001;错误:原因与重试，保留输入;成功:结果与去向;禁用:按钮置灰并写原因">页面</div></section>
<section id="navigation"><h2>导航树</h2><div class="node" data-navigation-id="N-001" data-page-id="P-001" data-from="标签栏">导航</div></section>
<section id="components"><h2>组件与动作</h2><div class="node" data-component-id="C-001" data-page-id="P-001">组件</div><button type="button" data-action-id="A-001" data-page-id="P-001" data-component-id="C-001" data-function-ids="F-001" data-feedback="进行中:按钮加载并忽略重复点击;成功:轻提示，留在 P-001;失败:原位写原因与重试">动作</button></section>
<section id="flows"><h2>交互流程与异常</h2><div class="node" data-flow-id="FL-001" data-exception="界面呈现失败原因并提供恢复入口" data-success="P-001">主流程</div></section>
<section id="states"><h2>界面状态</h2><div class="grid"><div class="node" data-state-id="S-001" data-module="{{MODULE}}" data-state-subject="{{MODULE}}" data-values="加载,空,错误,成功" data-initial="加载" data-terminal="成功" data-transitions="加载>成功@数据返回;加载>空@没有数据;加载>错误@请求失败;错误>加载@重试;空>成功@新建完成">加载、空、错误、成功、禁用</div></div></section>
<section id="data"><h2>页面数据</h2><div class="node" data-entity-id="D-001" data-module="{{MODULE}}" data-lifecycle="新建:A-001;查看:P-001;编辑:不提供（示例：由系统生成）;删除:不提供（示例：随上级对象删除）;状态:S-001">页面展示的数据字段</div></section>
<section id="trace"><h2>追溯矩阵</h2><table><thead><tr><th>需求</th><th>功能</th><th>调研</th></tr></thead><tbody><tr><td>REQ-001</td><td>F-001</td><td>REF-001</td></tr></tbody></table></section>
<section id="acceptance"><h2>验收标准</h2><ul><li>主流程、异常恢复与界面状态均可在原型中操作验证。</li><li>每个操作按“触发、反馈、结果、返回”走一遍，任何一步断开即不通过。</li></ul></section>
</main>
</body>
</html>
