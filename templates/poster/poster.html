<!doctype html>
<html lang="zh-CN" data-ic-base="../../kit/assets/icons" data-icons="mono" data-bg="glow">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>海报模板</title>
<link rel="icon" href="../../kit/assets/icons/flat/bouquet.webp">
<link rel="stylesheet" href="../../kit/tokens.css">
<link rel="stylesheet" href="../../kit/ui.css">
<link rel="stylesheet" href="../../kit/kit.css">
<style>
  /* 打包外壳：顶部 tab 与外观控制，下面一个满屏面板；不属于任何一端的产品界面 */
  html, body { height: 100%; }
  body { margin: 0; display: grid; grid-template-rows: 60px minmax(0, 1fr); overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--font); }
  .hd { display: flex; align-items: center; gap: var(--s-5); padding: 0 var(--s-6); background: var(--surface); border-bottom: 1px solid var(--line); z-index: 20; }
  .hd__brand { display: flex; align-items: center; gap: var(--s-3); flex: none; }
  .hd__brand img { width: 32px; height: 32px; object-fit: contain; }
  .hd__brand h1 { font-size: var(--fs-lg); font-weight: 700; line-height: 1; white-space: nowrap; }
  .tabs[hidden] { display: none; }
  .tabs { display: inline-flex; gap: 2px; padding: 3px; border-radius: var(--r-full); background: var(--zone); flex: none; }
  .tabs__item { min-height: 34px; padding: 0 var(--s-5); border-radius: var(--r-full); font-size: var(--fs-md); font-weight: 500; color: var(--ink-2); transition: background var(--dur-quick) var(--ease-out), color var(--dur-quick) var(--ease-out); }
  .tabs__item[aria-selected="true"] { background: var(--action); color: var(--surface); font-weight: 600; }
  [data-ui-workbench] .tabs { border-radius: 12px; }
  [data-ui-workbench] :is(.tabs__item, .tool, .iconseg, .iconseg button) { border-radius: 8px; }
  .tools { display: flex; align-items: center; gap: var(--s-2); margin-left: auto; flex-wrap: nowrap; }
  .tool { display: inline-flex; align-items: center; gap: var(--s-2); min-height: 36px; padding: 0 var(--s-3); border-radius: var(--r-full); background: var(--zone); font-size: var(--fs-sm); font-weight: 500; color: var(--ink-2); white-space: nowrap; }
  .tool:hover, .pop[data-open="true"] > .tool { background: var(--action-edge); }
  .tool .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--action); box-shadow: 0 0 0 2px var(--surface), 0 0 0 3px var(--line-strong); }
  .tool .fx { width: 18px; height: 14px; border-radius: 4px; background: var(--action-edge); }
  .pop { position: relative; }
  .pop__panel { position: absolute; top: calc(100% + 8px); right: 0; display: none; padding: var(--s-4); background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--elev-3); border: 1px solid var(--line); z-index: 30; }
  .pop[data-open="true"] > .pop__panel { display: block; }
  .pop__title { font-size: var(--fs-sm); font-weight: 600; color: var(--ink-2); margin-bottom: var(--s-3); }
  .swatches { display: grid; grid-template-columns: repeat(8, 28px); gap: var(--s-2); }
  .swatch { width: 28px; height: 28px; border-radius: 50%; background: var(--c); box-shadow: inset 0 0 0 2px var(--surface), 0 0 0 1px var(--line-strong); transition: transform var(--dur-quick) var(--ease-out); }
  .swatch:hover { transform: scale(1.12); }
  .swatch[aria-pressed="true"] { box-shadow: inset 0 0 0 3px var(--surface), 0 0 0 2px var(--c); transform: scale(1.1); }
  .custom { display: flex; align-items: center; gap: var(--s-3); margin-top: var(--s-4); padding-top: var(--s-3); border-top: 1px solid var(--line); font-size: var(--fs-sm); color: var(--ink-2); }
  .custom input[type="color"] { width: 40px; height: 28px; padding: 0; border: 0; border-radius: var(--r-sm); background: none; cursor: pointer; }
  .custom code { font-size: var(--fs-xs); color: var(--ink-3); }
  .fxlist { display: grid; grid-template-columns: repeat(3, 92px); gap: var(--s-2); }
  .fxitem { display: grid; gap: var(--s-1); padding: var(--s-1); border-radius: var(--r-md); font-size: var(--fs-xs); color: var(--ink-2); text-align: center; }
  .fxitem__tile { height: 44px; border-radius: var(--r-sm); background-color: var(--action-tint); box-shadow: inset 0 0 0 1px var(--line); }
  .fxitem[aria-pressed="true"] { background: var(--action-tint); box-shadow: inset 0 0 0 1.5px var(--action); color: var(--action-press); font-weight: 600; }
  .iconseg { display: inline-flex; padding: 3px; gap: 2px; border-radius: var(--r-full); background: var(--zone); }
  .iconseg button { min-height: 30px; padding: 0 var(--s-3); border-radius: var(--r-full); font-size: var(--fs-sm); color: var(--ink-2); }
  .iconseg button[aria-pressed="true"] { background: var(--surface); color: var(--action-press); font-weight: 600; box-shadow: var(--elev-1); }
  .home { font-size: var(--fs-sm); color: var(--ink-2); padding: 0 var(--s-2); white-space: nowrap; }

  main { position: relative; min-height: 0; }
  .panel { position: absolute; inset: 0; visibility: hidden; pointer-events: none; }
  .panel[data-on="true"] { visibility: visible; pointer-events: auto; }
  .host { position: absolute; inset: 0; }
  .host iframe { display: block; width: 100%; height: 100%; border: 0; background: var(--bg); }

  /* 整页模板：页面列表 | 预览 | 本页逻辑 */
  .wb { display: grid; grid-template-columns: 208px minmax(0, 1fr) 328px; height: 100%; }
  .wb__side { overflow-y: auto; padding: var(--s-4) var(--s-2) var(--s-4) var(--s-4); }
  .wb__side h2 { margin: 0 var(--s-2) var(--s-2); font-size: var(--fs-xs); font-weight: 600; color: var(--ink-3); }
  .nav { display: grid; gap: 2px; }
  .nav__item { display: flex; align-items: center; justify-content: space-between; gap: var(--s-2); min-height: 40px; padding: 0 var(--s-3); border-radius: var(--r-md); text-align: left; font-size: var(--fs-md); color: var(--ink-2); }
  .nav__item:hover { background: var(--zone); }
  .nav__item[aria-current="true"] { background: var(--action-tint); color: var(--action-press); font-weight: 600; box-shadow: inset 0 0 0 1px var(--action-edge); }
  .nav__item small { font-size: var(--fs-xs); color: var(--ink-3); font-weight: 400; }
  .wb__stage { position: relative; display: grid; grid-template: minmax(0, 1fr) / minmax(0, 1fr); place-items: center; margin: var(--s-3) 0; border-radius: var(--r-xl); overflow: hidden; background: color-mix(in srgb, var(--action) 4%, var(--bg)); box-shadow: inset 0 0 0 1px var(--line); }
  .frame { position: relative; flex: none; overflow: hidden; background: var(--surface); box-shadow: var(--elev-3); }
  .frame iframe { display: block; width: 100%; height: 100%; border: 0; background: var(--bg); }
  .frame--phone { width: 410px; height: 864px; border-radius: 42px; border: 10px solid var(--ink); }
  .frame--desktop { width: 1440px; height: 900px; border-radius: var(--r-lg); border: 1px solid var(--line-strong); }
  .wb__info { overflow-y: auto; padding: var(--s-4) var(--s-5) var(--s-5) var(--s-3); }
  .wb__info h2 { margin: 0 0 var(--s-3); font-size: var(--fs-xl); font-weight: 700; line-height: var(--lh-tight); }
  .wb__info h3 { margin: var(--s-5) 0 var(--s-2); font-size: var(--fs-sm); font-weight: 600; color: var(--ink-2); }
  .kv { display: grid; gap: var(--s-3); padding: var(--s-4); margin: 0; background: var(--surface); border-radius: var(--r-lg); box-shadow: inset 0 0 0 1px var(--line); }
  .kv > div { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: var(--s-3); align-items: baseline; }
  .kv dt { font-size: var(--fs-sm); color: var(--ink-3); }
  .kv dd { margin: 0; font-size: var(--fs-md); line-height: 1.55; }
  .ids { display: grid; padding: var(--s-1); background: var(--surface); border-radius: var(--r-lg); box-shadow: inset 0 0 0 1px var(--line); }
  .ids button { display: flex; align-items: center; justify-content: space-between; gap: var(--s-2); min-height: 38px; padding: 0 var(--s-3); border-radius: var(--r-sm); text-align: left; font-size: var(--fs-md); }
  .ids button:hover { background: var(--zone); }
  .ids code { font-size: var(--fs-xs); font-weight: 600; font-variant-numeric: tabular-nums; color: var(--action-press); background: var(--zone); padding: 2px 8px; border-radius: var(--r-sm); }
  @media (max-width: 1180px) { .wb { grid-template-columns: 188px minmax(0, 1fr); } .wb__info { display: none; } }
  @media (max-width: 860px) { .hd { gap: var(--s-3); padding: 0 var(--s-3); } .hd__brand h1, .home, .tool span { display: none; } .wb { grid-template-columns: minmax(0, 1fr); } .wb__side { display: none; } }
</style>
</head>
<body>
<header class="hd bgfx">
  <div class="hd__brand"><img data-ic="bouquet" src="../../kit/assets/icons/flat/bouquet.webp" alt=""><h1>海报模板</h1></div>
  <nav class="tabs" id="tabs" aria-label="模板分类"><button class="tabs__item" data-tab="wall" aria-selected="false">海报模板</button><button class="tabs__item" data-tab="prompts" aria-selected="false">提示词库</button></nav>
  <div class="tools">
    <div class="pop" id="pop-theme"><button class="tool" aria-haspopup="true" aria-expanded="false"><i class="dot"></i><span>主题色</span></button>
      <div class="pop__panel"><p class="pop__title">主题色 24 种，或自选</p><div class="swatches" id="swatches"></div>
        <label class="custom"><span>自选</span><input type="color" id="custom" value="#a75f6d" aria-label="自选主题色"><code id="customhex">#A75F6D</code></label></div></div>
    <div class="pop" id="pop-bg"><button class="tool" aria-haspopup="true" aria-expanded="false"><i class="fx"></i><span>背景</span></button>
      <div class="pop__panel"><p class="pop__title">背景效果</p><div class="fxlist" id="fxlist"></div></div></div>
    <div class="iconseg" id="iconseg" role="group" aria-label="图标形态"><button data-icons="mono" aria-pressed="true">单色</button><button data-icons="flat" aria-pressed="false">彩色</button><button data-icons="3d" aria-pressed="false">立体</button><button data-icons="real" aria-pressed="false">真实</button></div>
    <a class="home" href="../../index.html">模板库首页</a>
  </div>
</header>
<main>
<section class="panel" id="panel-wall"><div class="host" data-src="wall" data-label="海报模板"></div></section>
<section class="panel" id="panel-prompts"><div class="host" data-src="prompts" data-label="提示词库"></div></section>
</main>

<head>

<style>
  /* 海报墙：按用途分类，缩放预览紧挨着排成瀑布流，点开在新页打开原文件 */
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); }
  .lib { padding: 0 var(--s-5) var(--s-8); }
  .bar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: var(--s-3); margin: 0 calc(var(--s-5) * -1); padding: var(--s-3) var(--s-5); background: color-mix(in srgb, var(--bg) 94%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .pills { display: flex; flex: 1; gap: var(--s-2); overflow-x: auto; scrollbar-width: none; }
  .pills::-webkit-scrollbar { display: none; }
  .pill { flex: none; display: inline-flex; align-items: center; gap: var(--s-2); min-height: 34px; padding: 0 var(--s-3); border-radius: var(--r-full); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); font-size: var(--fs-sm); font-weight: 500; color: var(--ink-2); }
  .pill small { font-size: var(--fs-xs); font-weight: 600; color: var(--ink-3); }
  .pill:hover { background: var(--zone); }
  .pill[aria-pressed="true"] { background: var(--ink); color: var(--surface); box-shadow: none; }
  .pill[aria-pressed="true"] small { color: color-mix(in srgb, var(--surface) 70%, transparent); }
  .bar .search { flex: none; width: 240px; max-width: 34%; }
  .wall { column-width: 300px; column-gap: var(--s-3); margin-top: var(--s-4); }
  .item { display: grid; gap: var(--s-2); break-inside: avoid; margin: 0 0 var(--s-3); padding: var(--s-2); background: var(--surface); border-radius: var(--r-lg); box-shadow: inset 0 0 0 1px var(--line); }
  .item[hidden] { display: none; }
  .pv { position: relative; display: block; overflow: hidden; border-radius: var(--r-md); background: var(--zone); }
  .pv iframe { position: absolute; left: 0; top: 0; border: 0; transform-origin: top left; pointer-events: none; background: var(--bg); }
  .meta { display: flex; align-items: center; justify-content: space-between; gap: var(--s-2); padding: 0 var(--s-1) var(--s-1); }
  .meta h2 { margin: 0; font-size: var(--fs-md); font-weight: 600; line-height: var(--lh-tight); }
  .meta p { margin: 2px 0 0; font-size: var(--fs-xs); color: var(--ink-3); }
  .copy { flex: none; min-height: 26px; padding: 0 var(--s-2); border-radius: var(--r-sm); background: var(--zone); color: var(--action-press); font-size: var(--fs-xs); font-weight: 600; font-variant-numeric: tabular-nums; }
  .copy:hover { background: var(--action-edge); }
  .none { display: none; margin-top: var(--s-8); }
  .none.on { display: grid; }
</style>
</head>

<script>
  (function () {
    const ITEMS = [{"id": "PS-001", "name": "活动促销竖版", "use": "促销", "size": "1080×1440", "w": 1080, "h": 1440, "file": "source/templates/PS-001-活动竖版.html"}, {"id": "PS-002", "name": "新品发布竖版", "use": "新品", "size": "1080×1440", "w": 1080, "h": 1440, "file": "source/templates/PS-002-新品竖版.html"}, {"id": "PS-003", "name": "优惠券促销方版", "use": "促销", "size": "1080×1080", "w": 1080, "h": 1080, "file": "source/templates/PS-003-优惠券方版.html"}, {"id": "PS-004", "name": "节日礼盒手机长图", "use": "节日", "size": "1080×1920", "w": 1080, "h": 1920, "file": "source/templates/PS-004-节日长图.html"}, {"id": "PS-005", "name": "门店开业横版", "use": "门店", "size": "1920×1080", "w": 1920, "h": 1080, "file": "source/templates/PS-005-开业横版.html"}, {"id": "PS-006", "name": "会员招募竖版", "use": "招募", "size": "1080×1440", "w": 1080, "h": 1440, "file": "source/templates/PS-006-会员招募竖版.html"}, {"id": "PS-007", "name": "课程招生A4", "use": "招募", "size": "794×1123", "w": 794, "h": 1123, "file": "source/templates/PS-007-课程招生A4.html"}, {"id": "PS-008", "name": "招聘招募A4", "use": "招募", "size": "794×1123", "w": 794, "h": 1123, "file": "source/templates/PS-008-招聘A4.html"}, {"id": "PS-009", "name": "产品单品陈列", "use": "新品", "size": "1080×1350", "w": 1080, "h": 1350, "file": "source/templates/PS-009-单品陈列.html"}, {"id": "PS-010", "name": "品牌故事图文", "use": "品牌", "size": "1080×1440", "w": 1080, "h": 1440, "file": "source/templates/PS-010-品牌故事.html"}, {"id": "PS-011", "name": "数据海报", "use": "数据", "size": "1080×1440", "w": 1080, "h": 1440, "file": "source/templates/PS-011-数据海报.html"}, {"id": "PS-012", "name": "母亲节祝福海报", "use": "节日", "size": "1080×1440", "w": 1080, "h": 1440, "file": "source/templates/PS-012-母亲节祝福.html"}];
    const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
    const state = { use: 'all', q: '' };
    const uses = [...new Set(ITEMS.map(i => i.use))];
    $('#pills').innerHTML = `<button class="pill" data-use="all" aria-pressed="true">全部 <small>${ITEMS.length}</small></button>` + uses.map(u => `<button class="pill" data-use="${u}" aria-pressed="false">${u} <small>${ITEMS.filter(i => i.use === u).length}</small></button>`).join('');
    $('#wall').innerHTML = ITEMS.map(i => `<article class="item" data-id="${i.id}" data-use="${i.use}" data-text="${(i.id + i.name + i.use).toLowerCase()}">
      <a class="pv" href="${i.file}" target="_blank" rel="noopener" aria-label="打开${i.name}" style="aspect-ratio:${i.w} / ${i.h}" data-w="${i.w}"><iframe src="${i.file}?export=1" width="${i.w}" height="${i.h}" loading="lazy" tabindex="-1" aria-hidden="true"></iframe></a>
      <div class="meta"><div><h2>${i.name}</h2><p>${i.size}</p></div><button class="copy" data-copy="${i.id}" aria-label="复制编号 ${i.id}">${i.id}</button></div></article>`).join('');
    function scale() { $$('.pv').forEach(p => { const k = p.clientWidth / +p.dataset.w; $('iframe', p).style.transform = 'scale(' + k + ')'; }); }
    function draw() {
      const q = state.q.trim().toLowerCase(); let n = 0;
      $$('.item').forEach(el => { const on = (state.use === 'all' || el.dataset.use === state.use) && (!q || el.dataset.text.includes(q)); el.hidden = !on; if (on) n++; });
      $('#none').classList.toggle('on', n === 0); scale();
    }
    $('#pills').addEventListener('click', e => { const b = e.target.closest('.pill'); if (!b) return; $$('.pill').forEach(x => x.setAttribute('aria-pressed', String(x === b))); state.use = b.dataset.use; draw(); });
    $('#q').addEventListener('input', e => { state.q = e.target.value; draw(); });
    document.addEventListener('click', async e => { const b = e.target.closest('[data-copy]'); if (!b) return; try { await navigator.clipboard.writeText(b.dataset.copy); Lz.toast('已复制 ' + b.dataset.copy, 'success'); } catch (err) { Lz.toast('复制失败', 'danger'); } });
    // 主题、背景、图标由外壳统一控制：把消息转给每张海报
    addEventListener('message', e => { if (e.data && e.data.lz === 'skin') $$('.pv iframe').forEach(f => { try { f.contentWindow.postMessage(e.data, '*'); } catch (err) { /* 还在加载 */ } }); });
    $$('.pv iframe').forEach(f => f.addEventListener('load', () => { try { f.contentWindow.postMessage({ lz: 'skin', theme: document.documentElement.dataset.theme, bg: document.documentElement.dataset.bg, icons: document.documentElement.dataset.icons, color: document.documentElement.style.getPropertyValue('--action') && /^custom/.test(document.documentElement.dataset.theme || '') ? document.documentElement.style.getPropertyValue('--action') : undefined }, '*'); } catch (err) { /* 同上 */ } }));
    addEventListener('resize', scale); draw();
  })();

<script type="text/html" id="src-prompts"><!doctype html>
<html lang="zh-CN" data-ic-base="../../kit/assets/icons">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>海报提示词库</title>
<link rel="icon" href="../../kit/assets/icons/3d/giftbox.webp">
<link rel="stylesheet" href="../../kit/tokens.css">
<link rel="stylesheet" href="../../kit/ui.css">
<link rel="stylesheet" href="../../kit/kit.css">
<link rel="stylesheet" href="../../kit/web.css">
<style>
  /* 提示词库查看页：目录页，不属于任何一端的产品界面；类名一律带 px- 前缀 */
  body { background: var(--bg); }
  .px-in { max-width: 1480px; margin: 0 auto; padding: 0 var(--s-6); }
  .px-top { position: relative; isolation: isolate; padding: var(--s-6) 0 var(--s-1); background: linear-gradient(180deg, var(--action-tint) 0%, var(--bg) 100%); }
  .px-top::after { content: ""; position: absolute; inset: 0; z-index: -1; background: url(../../kit/assets/photo/pattern-petals.webp) right top / 340px; opacity: .3; -webkit-mask-image: linear-gradient(90deg, transparent 40%, #000 100%); mask-image: linear-gradient(90deg, transparent 40%, #000 100%); pointer-events: none; }
  .px-row { display: flex; align-items: center; justify-content: space-between; gap: var(--s-4); flex-wrap: wrap; }
  .px-brand { display: flex; align-items: center; gap: var(--s-3); min-width: 0; }
  .px-brand img { width: 44px; height: 44px; object-fit: contain; flex: none; }
  .px-brand h1 { font-size: var(--fs-3xl); font-weight: 700; line-height: var(--lh-tight); white-space: nowrap; }
  .px-top .search { width: 340px; max-width: 100%; }

  .px-tools { display: flex; align-items: center; gap: var(--s-3) var(--s-6); flex-wrap: wrap; margin-top: var(--s-4); padding: var(--s-3) var(--s-4); }
  .px-grp { display: flex; align-items: center; gap: var(--s-3); min-width: 0; }

        used(usedBy(s.id)) +
        '<footer class="px-foot"><button class="btn btn--secondary btn--sm" data-act="copy-style" data-id="' + s.id + '">复制风格块</button><button class="btn btn--text btn--sm" data-act="copy-sid" data-id="' + s.id + '">复制编号</button></footer></article>';
    });
    html += '</div></section><section class="px-cat"><div class="px-cat__head"><h2>负面约束</h2><span></span></div><div class="px-grid">';
    D.negatives.forEach(n => {
      html += '<article class="px-card px-gen" id="' + n.id + '" tabindex="-1" data-hay="' + esc((n.id + ' ' + n.name + ' ' + n.use + ' ' + n.text).toLowerCase()) + '">' +
        '<header class="px-title"><h3>' + esc(n.name) + '</h3><div class="px-meta"><span class="px-id">' + n.id + '</span></div></header>' +
        '<p class="px-use">' + esc(n.use) + '</p><pre class="px-negbox">' + esc(n.text) + '</pre>' + used(usedBy(n.id)) +
        '<footer class="px-foot"><button class="btn btn--secondary btn--sm" data-act="copy-neg" data-id="' + n.id + '">复制约束</button><button class="btn btn--text btn--sm" data-act="copy-sid" data-id="' + n.id + '">复制编号</button></footer></article>';
    });
    host.innerHTML = html + '</div></section>';
    paintStyles();
  }
  function paintStyles() {
    $$('#styles .px-gen').forEach(a => { const s = STYLE[a.id]; if (!s) return; $$('[data-f]', a).forEach(dd => { dd.innerHTML = subHtml(s[dd.dataset.f]); }); });
  }

  /* 过滤与计数 */
  function match(el) { return !state.q || el._hay.indexOf(state.q) >= 0; }
  function apply() {
    const inPrompts = state.view === 'prompts';
    $('#prompts').hidden = !inPrompts; $('#styles').hidden = inPrompts;
    $('#onlyVerified').hidden = !inPrompts; $('#expandAll').hidden = !inPrompts;
    let shown = 0; const per = {}; let total = 0;
    if (inPrompts) {
      $$('#prompts .px-card').forEach(el => {
        const base = match(el) && (!state.verified || el._p.verified);
        if (base) { per[el._p.category] = (per[el._p.category] || 0) + 1; total++; }
        const on = base && (state.cat === 'all' || el._p.category === state.cat); el.hidden = !on; if (on) shown++;
      });
      $$('#prompts .px-cat').forEach(sec => { const n = $$('.px-card:not([hidden])', sec).length; sec.hidden = n === 0; $('.px-cat__head span', sec).textContent = n + ' 条'; });
      $$('.px-pill[data-cat]').forEach(b => {
        const n = b.dataset.cat === 'all' ? total : (per[b.dataset.cat] || 0);
        $('small', b).textContent = n; b.dataset.zero = String(n === 0); b.setAttribute('aria-pressed', String(b.dataset.cat === state.cat));
      });
      $('.px-pill[data-view]').setAttribute('aria-pressed', 'false');
      $('#count').textContent = shown + ' 条提示词';
      $('#emptyText').textContent = '没有匹配的提示词';
    } else {
      let secs = 0;
      $$('#styles .px-cat').forEach(sec => { const cards = $$('.px-card', sec); let n = 0; cards.forEach(a => { const on = !state.q || a.dataset.hay.indexOf(state.q) >= 0; a.hidden = !on; if (on) n++; }); sec.hidden = n === 0; $('.px-cat__head span', sec).textContent = n + ' 个'; shown += n; secs++; });
      $$('.px-pill[data-cat]').forEach(b => b.setAttribute('aria-pressed', 'false'));
      $('.px-pill[data-view]').setAttribute('aria-pressed', 'true');
      $('#count').textContent = shown + ' 项';
      $('#emptyText').textContent = '没有匹配的风格与约束';
    }
    $('#empty').classList.toggle('on', shown === 0);
  }

  function setOpen(el, open) {
    const box = $('.px-prompt', el), btn = $('.px-more', el);
    box.dataset.open = String(open); btn.setAttribute('aria-expanded', String(open)); $('span', btn).textContent = open ? '收起提示词' : '展开提示词';
  }
  function applyTheme() {
    const t = theme();
    $$('#swatches .px-sw').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.theme === state.theme)));
    $('#read').innerHTML = '<span><i style="--c:' + t.hex + '"></i>主色 <b>' + esc(t.name + ' ' + t.hex) + '</b></span><span><i style="--c:' + t.secondary_hex + '"></i>辅色 <b>' + esc(t.secondary_name + ' ' + t.secondary_hex) + '</b></span>';
    $$('#prompts .px-card').forEach(paintPrompt); paintStyles();
  }
  function flash(el) { el.classList.remove('is-flash'); void el.offsetWidth; el.classList.add('is-flash'); el.focus({ preventScroll: true }); el.scrollIntoView({ behavior: Lz.reduce ? 'auto' : 'smooth', block: 'center' }); }
  function jump(id) {
    const isP = /^PP-/.test(id);
    state.view = isP ? 'prompts' : 'styles'; state.cat = 'all'; state.q = ''; state.verified = false; $('#q').value = ''; $('#onlyVerified').setAttribute('aria-pressed', 'false');
    apply(); const el = document.getElementById(id); if (el) flash(el);
  }

  /* 事件 */
  document.addEventListener('click', e => {
    const t = e.target;
    const pill = t.closest('.px-pill'); if (pill) { if (pill.dataset.view) { state.view = 'styles'; } else { state.view = 'prompts'; state.cat = pill.dataset.cat; } apply(); return; }
    const sw = t.closest('.px-sw'); if (sw) { state.theme = sw.dataset.theme; Lz.skin({ theme: state.theme }); applyTheme(); return; }
    const more = t.closest('.px-more'); if (more) { setOpen(more.closest('.px-card'), more.getAttribute('aria-expanded') !== 'true'); return; }
    const ref = t.closest('.px-ref'); if (ref) { jump(ref.dataset.style); return; }
    const jp = t.closest('[data-jump]'); if (jp) { jump(jp.dataset.jump); return; }
    const act = t.closest('[data-act]');
    if (act) {
      const a = act.dataset.act; const flashBtn = (txt) => { const old = act.textContent; act.textContent = txt; setTimeout(() => { act.textContent = old; }, 1400); };
      if (a === 'copy-prompt') { const p = act.closest('.px-card')._p; copy(sub(p.prompt), '已复制提示词 ' + p.id).then(ok => ok && flashBtn('已复制')); }
      else if (a === 'copy-id') { const p = act.closest('.px-card')._p; copy(p.id, '已复制编号 ' + p.id).then(ok => ok && flashBtn('已复制')); }
      else if (a === 'copy-style') { const s = STYLE[act.dataset.id]; copy(sub('Lighting: ' + s.lighting + '\nMaterial: ' + s.material + '\nColor: ' + s.color_rule), '已复制风格块 ' + s.id).then(ok => ok && flashBtn('已复制')); }
      else if (a === 'copy-neg') { const n = NEG[act.dataset.id]; copy('Avoid: ' + n.text + '.', '已复制约束 ' + n.id).then(ok => ok && flashBtn('已复制')); }
      else if (a === 'copy-sid') { copy(act.dataset.id, '已复制编号 ' + act.dataset.id).then(ok => ok && flashBtn('已复制')); }
    }
  });
  $('#q').addEventListener('input', e => { state.q = e.target.value.trim().toLowerCase(); apply(); });
  $('#onlyVerified').addEventListener('click', e => { state.verified = !state.verified; e.currentTarget.setAttribute('aria-pressed', String(state.verified)); apply(); });
  $('#expandAll').addEventListener('click', e => {
    state.all = !state.all; e.currentTarget.setAttribute('aria-pressed', String(state.all)); e.currentTarget.textContent = state.all ? '全部收起' : '全部展开';
    $$('#prompts .px-card').forEach(el => setOpen(el, state.all));
  });

  build();
  const start = () => { const th = document.documentElement.dataset.theme; if (th && D.themes.some(t => t.key === th)) state.theme = th; applyTheme(); apply(); if (/^#(PP|ST|NG)-\d{3}$/.test(location.hash)) jump(location.hash.slice(1)); };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
<\/script>
</body>
</html>
</script>
<script src="../../kit/ui.js"></script>
<script>
(function () {
  const CFG = {"key": "poster", "theme": "rose", "tabs": ["wall", "prompts"], "presets": [{"id": "rose", "name": "玫瑰", "action": "#A75F6D"}, {"id": "wine", "name": "酒红", "action": "#7E2C41"}, {"id": "coral", "name": "珊瑚", "action": "#AB6056"}, {"id": "terracotta", "name": "赤陶", "action": "#A26548"}, {"id": "amber", "name": "琥珀", "action": "#9B6B33"}, {"id": "sand", "name": "沙金", "action": "#87723E"}, {"id": "olive", "name": "橄榄", "action": "#74783E"}, {"id": "sage", "name": "鼠尾草", "action": "#637B63"}, {"id": "green", "name": "草绿", "action": "#458250"}, {"id": "pine", "name": "松绿", "action": "#31715B"}, {"id": "teal", "name": "青碧", "action": "#2B8181"}, {"id": "cyan", "name": "湖蓝", "action": "#307E98"}, {"id": "sky", "name": "天蓝", "action": "#3D79AB"}, {"id": "blue", "name": "靛蓝", "action": "#5373BC"}, {"id": "navy", "name": "藏青", "action": "#33476D"}, {"id": "indigo", "name": "靛紫", "action": "#716CBB"}, {"id": "purple", "name": "紫藤", "action": "#8069A9"}, {"id": "mauve", "name": "雾紫", "action": "#876C8D"}, {"id": "plum", "name": "梅紫", "action": "#9F608A"}, {"id": "graphite", "name": "石墨", "action": "#4E5359"}, {"id": "slate", "name": "岩灰", "action": "#536672"}, {"id": "stone", "name": "暖灰", "action": "#696259"}, {"id": "mocha", "name": "摩卡", "action": "#6A5243"}, {"id": "ink", "name": "墨黑", "action": "#222429"}], "effects": [{"id": "glow", "name": "柔光"}, {"id": "none", "name": "无"}, {"id": "dots", "name": "点阵"}, {"id": "grid", "name": "网格"}, {"id": "lines", "name": "斜纹"}, {"id": "rings", "name": "同心圆"}, {"id": "petal", "name": "花瓣"}, {"id": "leaf", "name": "叶片"}, {"id": "wave", "name": "波纹"}]};
  const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const state = { theme: CFG.theme, color: null, bg: CFG.background || 'glow', icons: 'mono' };
  const frames = new Set();
  const store = { get(k) { try { return localStorage.getItem('lz-bundle-' + k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem('lz-bundle-' + k, v); } catch (e) { /* 浏览器不让存时只是不记住 */ } } };
  const q = new URLSearchParams(location.search);
  const skinKeys = ['theme', 'bg', 'icons', 'color'];
  const skinKey = k => CFG.workbench ? 'frontend-' + k : k;
  const oldDefaults = { theme: 'rose', bg: 'glow', icons: 'mono', color: '' };
  skinKeys.forEach(k => {
    const legacy = store.get(k);
    const saved = store.get(skinKey(k)) ?? (legacy === oldDefaults[k] ? null : legacy);
    const value = q.get(k) || saved;
    if (value) state[k] = value;
  });
  if (state.color) state.theme = null;

  function send(win) { try { win.postMessage({ lz: 'skin', theme: state.theme || undefined, color: state.color || undefined, bg: state.bg, icons: state.icons }, '*'); } catch (e) { /* 框还没准备好 */ } }
  function apply() {
    Lz.skin({ theme: state.theme || undefined, color: state.color || undefined, bg: state.bg, icons: state.icons });
    frames.forEach(f => f.contentWindow && send(f.contentWindow));
    $$('#swatches .swatch').forEach(b => b.setAttribute('aria-pressed', String(!state.color && b.dataset.theme === state.theme)));
    $$('#fxlist .fxitem').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.bg === state.bg)));
    $$('#iconseg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.icons === state.icons)));
    skinKeys.forEach(k => store.set(skinKey(k), state[k] || ''));
  }
  function mount(host, html, cls) {
    const f = document.createElement('iframe'); f.setAttribute('aria-label', host.dataset.label || '预览');
    f.addEventListener('load', () => { frames.add(f); send(f.contentWindow); });
    f.srcdoc = html; host.appendChild(f); return f;
  }
  const source = id => ($('#src-' + id).textContent || '').replace(/<\\\/script/g, '</script');

  // 外观控制
  $('#swatches').innerHTML = CFG.presets.map(p => `<button class="swatch" style="--c:${p.action}" data-theme="${p.id}" aria-pressed="false" aria-label="${p.name}" data-tip="${p.name}"></button>`).join('');
  $('#fxlist').innerHTML = CFG.effects.map(e => `<button class="fxitem" data-bg="${e.id}" aria-pressed="false"><span class="fxitem__tile bgfx bgfx--${e.id}" ${e.id === 'none' ? '' : ''}></span>${e.name}</button>`).join('');
  $('#swatches').addEventListener('click', e => { const b = e.target.closest('.swatch'); if (!b) return; state.theme = b.dataset.theme; state.color = null; apply(); });
  $('#custom').addEventListener('input', e => { state.color = e.target.value; state.theme = null; $('#customhex').textContent = e.target.value.toUpperCase(); apply(); });
  $('#fxlist').addEventListener('click', e => { const b = e.target.closest('.fxitem'); if (!b) return; state.bg = b.dataset.bg; apply(); });
  $('#iconseg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; state.icons = b.dataset.icons; apply(); });
  $$('.pop').forEach(p => p.firstElementChild.addEventListener('click', e => { e.stopPropagation(); const open = p.dataset.open !== 'true'; $$('.pop').forEach(x => { x.dataset.open = 'false'; x.firstElementChild.setAttribute('aria-expanded', 'false'); }); p.dataset.open = String(open); p.firstElementChild.setAttribute('aria-expanded', String(open)); }));
  document.addEventListener('click', e => { if (!e.target.closest('.pop__panel')) $$('.pop').forEach(x => { x.dataset.open = 'false'; x.firstElementChild.setAttribute('aria-expanded', 'false'); }); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') $$('.pop').forEach(x => { x.dataset.open = 'false'; }); });

  // tab
  const mounted = {};
  function openTab(id) {
    $$('#tabs .tabs__item').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === id)));
    $$('.panel').forEach(p => { p.dataset.on = String(p.id === 'panel-' + id); });
    if (!mounted[id]) { mounted[id] = true; const host = $('#panel-' + id + ' .host'); if (host) mount(host, source(host.dataset.src)); else if (id === CFG.workbench) openPage(page); }
    store.set('tab-' + CFG.key, id); fit();
  }
  $('#tabs').addEventListener('click', e => { const b = e.target.closest('.tabs__item'); if (b) openTab(b.dataset.tab); });

  // 整页模板工作台
  let page = CFG.pages && CFG.pages[0] ? CFG.pages[0].id : null, pageFrame = null;
  const frame = $('#frame');
  function fit() {
    const stage = $('.wb__stage'); if (!stage || !frame || !stage.clientWidth) return;
    if (CFG.device === 'phone') {
      const k = Math.min(1, (stage.clientHeight - 28) / 864, (stage.clientWidth - 28) / 410);
      frame.style.transform = 'scale(' + k + ')';
    } else { // 桌面：宽按 1440 缩放，高度随舞台补满，页面按真实窗口比例显示
      const k = Math.min(1, (stage.clientWidth - 28) / 1440);
      frame.style.height = Math.floor((stage.clientHeight - 28) / k) + 'px'; frame.style.transform = 'scale(' + k + ')';
    }
    frame.style.transformOrigin = 'center center';
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
  function openPage(id) {
    page = id; const p = CFG.pages.find(x => x.id === id);
    $$('#nav .nav__item').forEach(b => b.setAttribute('aria-current', String(b.dataset.page === id)));
    if (pageFrame) { frames.delete(pageFrame); pageFrame.remove(); }
    pageFrame = mount(frame, source('page-' + id));
    $('#info').innerHTML = `<h2>${esc(p.name)}</h2><h3>本页逻辑</h3><dl class="kv">${p.logic.map(([k, v]) => `<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl><h3>本页组件编号</h3><div class="ids">${p.ids.map(c => `<button data-copy="${c.id}"><span>${esc(c.name)}</span><code>${c.id}</code></button>`).join('')}</div>`;
    fit();
  }
  if (frame) {
    $('#nav').innerHTML = '<h2>完整页面</h2>' + CFG.pages.map(p => `<button class="nav__item" data-page="${p.id}" aria-current="false"><span>${esc(p.name)}</span><small>${p.ids.length} 块</small></button>`).join('');
    $('#nav').addEventListener('click', e => { const b = e.target.closest('[data-page]'); if (b) openPage(b.dataset.page); });
    $('#info').addEventListener('click', async e => { const b = e.target.closest('[data-copy]'); if (!b) return; try { await navigator.clipboard.writeText(b.dataset.copy); Lz.toast('已复制 ' + b.dataset.copy, 'success'); } catch (err) { Lz.toast('复制失败', 'danger'); } });
    addEventListener('message', e => { if (e.data && e.data.lz === 'goto' && CFG.pages.some(p => p.id === e.data.page)) { openTab(CFG.workbench); openPage(e.data.page); } });
    addEventListener('resize', fit);
  }
  // 海报墙：缩放预览，点击在新页打开原文件
  $$('.wall').forEach(w => { const f = $('iframe', w); });

  apply();
  openTab(store.get('tab-' + CFG.key) && CFG.tabs.includes(store.get('tab-' + CFG.key)) ? store.get('tab-' + CFG.key) : CFG.tabs[0]);
})();
</script>
