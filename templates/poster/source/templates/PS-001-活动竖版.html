<!doctype html>
<html lang="zh-CN" data-ic-base="../../../../kit/assets/icons">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>活动促销竖版</title>
<link rel="icon" href="../../../../kit/assets/icons/flat/bouquet.webp">
<link rel="stylesheet" href="../../../../kit/tokens.css">
<style>
:root { --pw: 1080px; --ph: 1440px; }
/* 海报画布与预览：画布大小写死，页面按视口缩放预览；地址加 ?export=1 去掉缩放与外框，用于导出 */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: color-mix(in srgb, var(--ink) 12%, var(--bg)); font: 400 16px/1.5 var(--font); color: var(--ink); -webkit-font-smoothing: antialiased; }
.pv { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
.pv__fit { --k: 1; position: relative; width: calc(var(--pw) * var(--k)); height: calc(var(--ph) * var(--k)); box-shadow: var(--elev-3); }
.poster { position: absolute; left: 0; top: 0; width: var(--pw); height: var(--ph); overflow: hidden; transform: scale(var(--k)); transform-origin: 0 0; background: var(--bg); color: var(--ink); font-family: var(--font); line-height: 1.3; text-rendering: optimizeLegibility; }
.poster *, .poster *::before, .poster *::after { margin: 0; padding: 0; }
.poster img { display: block; }
.poster h1, .poster h2, .poster h3, .poster p { font-weight: inherit; }
.x-tex { position: absolute; inset: 0; background: url(../../../../kit/assets/photo/pattern-petals.webp) 0 0 / 520px; opacity: .45; pointer-events: none; }
.x-nw { white-space: nowrap; }
.is-export body, .is-export { background: transparent; }
.is-export .pv { display: block; min-height: 0; padding: 0; }
.is-export .pv__fit { --k: 1; box-shadow: none; }
.marks i { position: absolute; background: var(--ink-2); }
@media print { html, body { background: none; } .pv { display: block; min-height: 0; padding: 0; } .pv__fit { --k: 1; box-shadow: none; } .marks { display: none; } }

/* ── 本海报 ── */
.p1 { --m: 72px; }
.p1 .wash { position: absolute; inset: 0; background:
  radial-gradient(620px 620px at 82% 40%, color-mix(in srgb, var(--action) 16%, var(--bg)), transparent 70%),
  radial-gradient(520px 520px at 0% 100%, color-mix(in srgb, var(--accent) 12%, var(--bg)), transparent 70%); }
.p1 .x-tex { -webkit-mask-image: linear-gradient(200deg, black 0%, transparent 46%); mask-image: linear-gradient(200deg, black 0%, transparent 46%); opacity: .5; }
.p1 .brand { position: absolute; left: var(--m); top: 72px; display: flex; align-items: center; gap: 14px; font-size: 38px; font-weight: 600; letter-spacing: .06em; }
.p1 .brand img { width: 60px; height: 60px; }
.p1 .badge { position: absolute; right: var(--m); top: 78px; height: 52px; padding: 0 26px; display: flex; align-items: center; border: 2px solid var(--action); border-radius: 999px; color: var(--action-press); font-size: 28px; font-weight: 600; letter-spacing: .08em; }
.p1 .title { position: absolute; left: var(--m); top: 196px; font-size: 156px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; white-space: nowrap; }
.p1 .title b { color: var(--action); font-weight: 700; }
.p1 .sub { position: absolute; left: var(--m); top: 392px; font-size: 40px; font-weight: 500; color: var(--ink-2); letter-spacing: .04em; white-space: nowrap; }
.p1 .rule { position: absolute; left: var(--m); top: 470px; width: 96px; height: 4px; background: var(--accent); border-radius: 2px; }
.p1 .list { position: absolute; left: var(--m); top: 540px; width: 340px; }
.p1 .list__lab { font-size: 28px; font-weight: 600; color: var(--action-press); letter-spacing: .2em; }
.p1 .item { margin-top: 28px; padding-top: 24px; border-top: 2px solid var(--line-strong); display: flex; align-items: flex-end; justify-content: space-between; }
.p1 .item:first-of-type { margin-top: 20px; }
.p1 .item__name { font-size: 36px; font-weight: 600; }
.p1 .item__old { margin-top: 6px; font-size: 28px; color: var(--ink-3); text-decoration: line-through; font-variant-numeric: tabular-nums; }
.p1 .item__price { font-size: 60px; font-weight: 700; color: var(--price); line-height: 1; font-variant-numeric: tabular-nums; }
.p1 .item__price small { font-size: 30px; font-weight: 600; margin-right: 2px; }
.p1 .ring { position: absolute; left: 456px; top: 512px; width: 552px; height: 672px; border: 3px solid color-mix(in srgb, var(--action) 50%, transparent); border-radius: 276px 276px 0 0; }
.p1 .arch { position: absolute; left: 504px; top: 484px; width: 504px; height: 672px; border-radius: 252px 252px 0 0; overflow: hidden; box-shadow: var(--elev-3); }
.p1 .arch img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 40%; }
.p1 .seal { position: absolute; left: 410px; top: 968px; width: 200px; height: 208px; border-radius: 50%; background: var(--accent); color: var(--surface); display: grid; place-content: center; text-align: center; box-shadow: var(--elev-2); }
.p1 .seal::before { content: ""; position: absolute; inset: 10px; border: 2px dashed color-mix(in srgb, var(--surface) 70%, transparent); border-radius: 50%; }
.p1 .seal span { font-size: 32px; font-weight: 500; letter-spacing: .1em; }
.p1 .seal strong { font-size: 60px; font-weight: 700; line-height: 1.1; }
.p1 .band { position: absolute; left: 0; right: 0; bottom: 0; height: 250px; background: var(--action); color: var(--surface); display: grid; grid-template-columns: repeat(3, 1fr); padding: 38px var(--m) 0; }
.p1 .band > div + div { padding-left: 36px; border-left: 2px solid color-mix(in srgb, var(--surface) 35%, transparent); }
.p1 .band h3 { font-size: 28px; font-weight: 500; letter-spacing: .3em; }
.p1 .band p { margin-top: 10px; font-size: 34px; font-weight: 600; line-height: 1.34; }
</style>
</head>
<body>
<div class="pv"><div class="pv__fit">
<main class="poster" id="poster" data-cid="PS-001" data-name="活动促销竖版" data-size="1080×1440" data-use="促销">
<div class="p1">
  <div class="wash"></div>
  <div class="x-tex"></div>
  <div class="brand"><img data-ic="bouquet" src="../../../../kit/assets/icons/flat/bouquet.webp" alt="">花间集</div>
  <div class="badge">限时三天</div>
  <h1 class="title">鲜花限时<b>七折</b></h1>
  <p class="sub">三款人气花束 周末到店即享</p>
  <div class="rule"></div>
  <div class="list">
    <div class="list__lab">活动价</div>
    <div class="item"><div><div class="item__name">红玫瑰花束</div><div class="item__old">原价 ¥199</div></div><div class="item__price"><small>¥</small>139</div></div>
    <div class="item"><div><div class="item__name">粉芍药花束</div><div class="item__old">原价 ¥239</div></div><div class="item__price"><small>¥</small>167</div></div>
    <div class="item"><div><div class="item__name">向日葵花束</div><div class="item__old">原价 ¥159</div></div><div class="item__price"><small>¥</small>111</div></div>
  </div>
  <div class="ring"></div>
  <div class="arch"><img src="../../../../kit/assets/photo/product-peony-pink.webp" alt="粉芍药花束"></div>
  <div class="seal"><span>第二束</span><strong>半价</strong></div>
  <div class="band">
    <div><h3>时间</h3><p>周末全天<br>限时三天</p></div>
    <div><h3>地点</h3><p>建国路店<br>徐汇滨江店<br>浦东世纪店</p></div>
    <div><h3>方式</h3><p>到店自提<br>同城配送</p></div>
  </div>
</div>
</main>
</div></div>
<script src="../../../../kit/ui.js"></script>
<script>
(function () {
  var q = new URLSearchParams(location.search), root = document.documentElement;
  if (q.get('export') === '1') root.classList.add('is-export');
  if (q.get('bleed') === '1') root.classList.add('is-bleed');
  var p = document.getElementById('poster'), fit = p.parentNode;
  function fitIt() {
    if (root.classList.contains('is-export')) { fit.style.setProperty('--k', 1); return; }
    var k = Math.min((innerWidth - 48) / p.offsetWidth, (innerHeight - 48) / p.offsetHeight, 1);
    fit.style.setProperty('--k', Math.max(k, 0.05));
  }
  addEventListener('resize', fitIt); fitIt();
  var pg = document.createElement('style');
  pg.textContent = '@page{size:' + p.offsetWidth + 'px ' + p.offsetHeight + 'px;margin:0}';
  document.head.appendChild(pg);
  if (root.classList.contains('is-bleed') && !root.classList.contains('is-export')) {
    var m = document.createElement('div'); m.className = 'marks'; m.setAttribute('aria-hidden', 'true');
    var b = parseFloat(getComputedStyle(p).getPropertyValue('--bleed')) || 11.34, L = 20, G = 4;
    var W = p.offsetWidth, H = p.offsetHeight;
    [[0, 0], [1, 0], [0, 1], [1, 1]].forEach(function (c) {
      var x = c[0] ? W - b : b, y = c[1] ? H - b : b;
      var v = [x - 0.5, c[1] ? H + G : -G - L, 1, L], h = [c[0] ? W + G : -G - L, y - 0.5, L, 1];
      [v, h].forEach(function (r) {
        var i = document.createElement('i'); i.style.cssText = 'left:' + r[0] + 'px;top:' + r[1] + 'px;width:' + r[2] + 'px;height:' + r[3] + 'px';
        m.appendChild(i);
      });
    });
    m.style.cssText = 'position:absolute;left:0;top:0;width:' + W + 'px;height:' + H + 'px;transform:scale(var(--k));transform-origin:0 0;pointer-events:none';
    fit.appendChild(m);
  }
})();
</script>
</body>
</html>
