<!doctype html>
<html lang="zh-CN" data-ic-base="../../../../kit/assets/icons">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>新品发布竖版</title>
<link rel="icon" href="../../../../kit/assets/icons/flat/bouquet.webp">
<link rel="stylesheet" href="../../../../kit/tokens.css">
<style>
:root { --pw: 1080px; --ph: 1440px; }
/* 海报画布与预览：画布大小写死，页面按视口缩放预览；地址加 ?export=1 去掉缩放与外框，用于导出 */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: color-mix(in srgb, var(--ink) 12%, var(--bg)); font: 400 16px/1.5 var(--font); color: var(--ink); -webkit-font-smoothing: antialiased; }
.pv { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
.pv__fit { --k: 1; position: relative; width: calc(var(--pw) * var(--k)); height: calc(var(--ph) * var(--k)); box-shadow: var(--elev-3); }
.poster { position: absolute; left: 0; top: 0; width: var(--pw); height: var(--ph); overflow: hidden; transform: scale(var(--k)); transform-origin: 0 0; background: var(--bg); color: var(--ink); font-family: var(--font); line-height: 1.3; text-rendering: optimizeLegibility; }
.poster *, .poster *::before, .poster *::after { margin: 0; padding: 0; }
.poster img { display: block; }
.poster h1, .poster h2, .poster h3, .poster p { font-weight: inherit; }
.x-tex { position: absolute; inset: 0; background: url(../../../../kit/assets/photo/pattern-petals.webp) 0 0 / 520px; opacity: .45; pointer-events: none; }
.x-nw { white-space: nowrap; }
.is-export body, .is-export { background: transparent; }
.is-export .pv { display: block; min-height: 0; padding: 0; }
.is-export .pv__fit { --k: 1; box-shadow: none; }
.marks i { position: absolute; background: var(--ink-2); }
@media print { html, body { background: none; } .pv { display: block; min-height: 0; padding: 0; } .pv__fit { --k: 1; box-shadow: none; } .marks { display: none; } }

/* ── 本海报 ── */
.p2 { position: absolute; inset: 0; background: var(--action-press); color: var(--bg); }
.p2 .glow { position: absolute; inset: 0; background:
  radial-gradient(640px 640px at 50% 46%, color-mix(in srgb, var(--action) 70%, var(--action-press)), transparent 72%),
  radial-gradient(460px 460px at 100% 0%, color-mix(in srgb, var(--accent) 30%, var(--action-press)), transparent 70%); }
.p2 .x-tex { mix-blend-mode: soft-light; opacity: .22; }
.p2 .head { position: absolute; left: 72px; right: 72px; top: 68px; display: flex; align-items: center; justify-content: space-between; }
.p2 .brand { display: flex; align-items: center; gap: 14px; font-size: 36px; font-weight: 600; letter-spacing: .06em; }
.p2 .brand img { width: 56px; height: 56px; }
.p2 .tag { font-size: 28px; font-weight: 500; letter-spacing: .3em; color: var(--accent-tint); display: flex; align-items: center; gap: 18px; }
.p2 .tag::before { content: ""; width: 64px; height: 2px; background: var(--accent-tint); }
.p2 .title { position: absolute; left: 0; right: 0; top: 168px; text-align: center; font-size: 124px; font-weight: 700; letter-spacing: .02em; white-space: nowrap; line-height: 1.1; }
.p2 .ringo { position: absolute; left: 50%; top: 664px; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--bg) 26%, transparent); transform: translate(-50%, -50%); }
.p2 .ringo.a { width: 760px; height: 760px; }
.p2 .ringo.b { width: 880px; height: 880px; border-color: color-mix(in srgb, var(--bg) 14%, transparent); }
.p2 .disc { position: absolute; left: 50%; top: 664px; width: 660px; height: 660px; border-radius: 50%; overflow: hidden; transform: translate(-50%, -50%); border: 12px solid var(--action-edge); box-shadow: var(--elev-4); }
.p2 .disc img { width: 100%; height: 100%; object-fit: cover; transform: scale(1.04); }
.p2 .seal { position: absolute; left: 740px; top: 372px; width: 176px; height: 176px; border-radius: 50%; background: var(--accent-tint); color: var(--accent); display: grid; place-content: center; text-align: center; box-shadow: var(--elev-3); }
.p2 .seal::before { content: ""; position: absolute; inset: 9px; border: 2px dashed var(--accent); border-radius: 50%; opacity: .7; }
.p2 .seal strong { font-size: 52px; font-weight: 700; letter-spacing: .04em; line-height: 1.1; }
.p2 .seal span { font-size: 28px; font-weight: 600; letter-spacing: .2em; }
.p2 .name { position: absolute; left: 0; right: 0; top: 1040px; text-align: center; font-size: 52px; font-weight: 600; letter-spacing: .1em; }
.p2 .price { position: absolute; left: 0; right: 0; top: 1102px; text-align: center; font-size: 128px; font-weight: 700; line-height: 1; color: var(--accent-tint); font-variant-numeric: tabular-nums; }
.p2 .price small { font-size: 56px; font-weight: 600; margin-right: 6px; }
.p2 .facts { position: absolute; left: 72px; right: 72px; bottom: 64px; display: grid; grid-template-columns: repeat(3, 1fr); border-top: 2px solid color-mix(in srgb, var(--bg) 30%, transparent); padding-top: 28px; text-align: center; }
.p2 .facts > div + div { border-left: 2px solid color-mix(in srgb, var(--bg) 22%, transparent); }
.p2 .facts h3 { font-size: 26px; font-weight: 500; letter-spacing: .3em; color: var(--accent-tint); }
.p2 .facts p { margin-top: 8px; font-size: 34px; font-weight: 600; }
</style>
</head>
<body>
<div class="pv"><div class="pv__fit">
<main class="poster" id="poster" data-cid="PS-002" data-name="新品发布竖版" data-size="1080×1440" data-use="新品">
<div class="p2">
  <div class="glow"></div>
  <div class="x-tex"></div>
  <div class="head"><div class="brand"><img data-ic="bouquet" src="../../../../kit/assets/icons/flat/bouquet.webp" alt="">花间集</div><div class="tag">新品发布</div></div>
  <h1 class="title">粉玫瑰系列上新</h1>
  <div class="ringo b"></div><div class="ringo a"></div>
  <div class="disc"><img src="../../../../kit/assets/photo/bouquet-rose.webp" alt="粉玫瑰花束"></div>
  <div class="seal"><strong>新品</strong><span>首发</span></div>
  <h2 class="name">粉玫瑰限定花束</h2>
  <div class="price"><small>¥</small>229</div>
  <div class="facts">
    <div><h3>花材</h3><p>玫瑰 尤加利</p></div>
    <div><h3>规格</h3><p>二十朵一束</p></div>
    <div><h3>上市</h3><p>三家门店同步</p></div>
  </div>
</div>
</main>
</div></div>
<script src="../../../../kit/ui.js"></script>
<script>
(function () {
  var q = new URLSearchParams(location.search), root = document.documentElement;
  if (q.get('export') === '1') root.classList.add('is-export');
  if (q.get('bleed') === '1') root.classList.add('is-bleed');
  var p = document.getElementById('poster'), fit = p.parentNode;
  function fitIt() {
    if (root.classList.contains('is-export')) { fit.style.setProperty('--k', 1); return; }
    var k = Math.min((innerWidth - 48) / p.offsetWidth, (innerHeight - 48) / p.offsetHeight, 1);
    fit.style.setProperty('--k', Math.max(k, 0.05));
  }
  addEventListener('resize', fitIt); fitIt();
  var pg = document.createElement('style');
  pg.textContent = '@page{size:' + p.offsetWidth + 'px ' + p.offsetHeight + 'px;margin:0}';
  document.head.appendChild(pg);
  if (root.classList.contains('is-bleed') && !root.classList.contains('is-export')) {
    var m = document.createElement('div'); m.className = 'marks'; m.setAttribute('aria-hidden', 'true');
    var b = parseFloat(getComputedStyle(p).getPropertyValue('--bleed')) || 11.34, L = 20, G = 4;
    var W = p.offsetWidth, H = p.offsetHeight;
    [[0, 0], [1, 0], [0, 1], [1, 1]].forEach(function (c) {
      var x = c[0] ? W - b : b, y = c[1] ? H - b : b;
      var v = [x - 0.5, c[1] ? H + G : -G - L, 1, L], h = [c[0] ? W + G : -G - L, y - 0.5, L, 1];
      [v, h].forEach(function (r) {
        var i = document.createElement('i'); i.style.cssText = 'left:' + r[0] + 'px;top:' + r[1] + 'px;width:' + r[2] + 'px;height:' + r[3] + 'px';
        m.appendChild(i);
      });
    });
    m.style.cssText = 'position:absolute;left:0;top:0;width:' + W + 'px;height:' + H + 'px;transform:scale(var(--k));transform-origin:0 0;pointer-events:none';
    fit.appendChild(m);
  }
})();
</script>
</body>
</html>
