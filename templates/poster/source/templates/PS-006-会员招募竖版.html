<!doctype html>
<html lang="zh-CN" data-ic-base="../../../../kit/assets/icons">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>会员招募竖版</title>
<link rel="icon" href="../../../../kit/assets/icons/flat/bouquet.webp">
<link rel="stylesheet" href="../../../../kit/tokens.css">
<style>
:root { --pw: 1080px; --ph: 1440px; }
/* 海报画布与预览：画布大小写死，页面按视口缩放预览；地址加 ?export=1 去掉缩放与外框，用于导出 */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: color-mix(in srgb, var(--ink) 12%, var(--bg)); font: 400 16px/1.5 var(--font); color: var(--ink); -webkit-font-smoothing: antialiased; }
.pv { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
.pv__fit { --k: 1; position: relative; width: calc(var(--pw) * var(--k)); height: calc(var(--ph) * var(--k)); box-shadow: var(--elev-3); }
.poster { position: absolute; left: 0; top: 0; width: var(--pw); height: var(--ph); overflow: hidden; transform: scale(var(--k)); transform-origin: 0 0; background: var(--bg); color: var(--ink); font-family: var(--font); line-height: 1.3; text-rendering: optimizeLegibility; }
.poster *, .poster *::before, .poster *::after { margin: 0; padding: 0; }
.poster img { display: block; }
.poster h1, .poster h2, .poster h3, .poster p { font-weight: inherit; }
.x-tex { position: absolute; inset: 0; background: url(../../../../kit/assets/photo/pattern-petals.webp) 0 0 / 520px; opacity: .45; pointer-events: none; }
.x-nw { white-space: nowrap; }
.is-export body, .is-export { background: transparent; }
.is-export .pv { display: block; min-height: 0; padding: 0; }
.is-export .pv__fit { --k: 1; box-shadow: none; }
.marks i { position: absolute; background: var(--ink-2); }
@media print { html, body { background: none; } .pv { display: block; min-height: 0; padding: 0; } .pv__fit { --k: 1; box-shadow: none; } .marks { display: none; } }

/* ── 本海报 ── */
.p6 { position: absolute; inset: 0; background: var(--accent-tint); }
.p6 .wash { position: absolute; inset: 0; background: radial-gradient(700px 700px at 50% 38%, color-mix(in srgb, var(--surface) 80%, transparent), transparent 70%); }
.p6 .x-tex { opacity: .35; -webkit-mask-image: linear-gradient(180deg, black 0%, transparent 50%); mask-image: linear-gradient(180deg, black 0%, transparent 50%); }
.p6 .brand { position: absolute; left: 0; right: 0; top: 64px; display: flex; align-items: center; justify-content: center; gap: 14px; font-size: 38px; font-weight: 600; letter-spacing: .08em; color: var(--accent); }
.p6 .brand img { width: 60px; height: 60px; }
.p6 .title { position: absolute; left: 0; right: 0; top: 168px; text-align: center; font-size: 140px; font-weight: 700; letter-spacing: .02em; line-height: 1.1; white-space: nowrap; }
.p6 .title b { color: var(--accent); font-weight: 700; }
.p6 .sub { position: absolute; left: 0; right: 0; top: 340px; display: flex; align-items: center; justify-content: center; gap: 24px; font-size: 38px; font-weight: 500; letter-spacing: .3em; color: var(--ink-2); }
.p6 .sub::before, .p6 .sub::after { content: ""; width: 88px; height: 3px; background: var(--accent); opacity: .6; }
.p6 .ring { position: absolute; left: 276px; top: 438px; width: 528px; height: 600px; border: 3px solid var(--accent); border-radius: 264px 264px 0 0; opacity: .55; }
.p6 .ring.b { left: 252px; top: 414px; width: 576px; height: 624px; opacity: .25; border-radius: 288px 288px 0 0; }
.p6 .arch { position: absolute; left: 300px; top: 462px; width: 480px; height: 576px; border-radius: 240px 240px 0 0; overflow: hidden; box-shadow: var(--elev-3); }
.p6 .arch img { width: 100%; height: 100%; object-fit: cover; object-position: 100% 50%; }
.p6 .ic { position: absolute; filter: drop-shadow(0 14px 16px color-mix(in srgb, var(--accent) 28%, transparent)); }
.p6 .ic.star { left: 688px; top: 398px; width: 200px; }
.p6 .ic.card { left: 116px; top: 640px; width: 190px; }
.p6 .ic.heart { left: 718px; top: 830px; width: 150px; }
.p6 .ic.coupon { left: 178px; top: 868px; width: 140px; }
.p6 .perks { position: absolute; left: 72px; right: 72px; top: 1086px; display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; }
.p6 .perk + .perk { border-left: 2px solid color-mix(in srgb, var(--accent) 35%, transparent); }
.p6 .perk i { display: block; font-style: normal; font-size: 40px; font-weight: 700; color: var(--accent); letter-spacing: .1em; font-variant-numeric: tabular-nums; }
.p6 .perk h3 { margin-top: 6px; font-size: 44px; font-weight: 700; letter-spacing: .04em; }
.p6 .perk p { margin-top: 6px; font-size: 32px; color: var(--ink-2); }
.p6 .join { position: absolute; left: 0; right: 0; bottom: 0; height: 168px; background: var(--accent); color: var(--surface); display: flex; align-items: center; justify-content: space-between; padding: 0 72px; }
.p6 .join h4 { font-size: 56px; font-weight: 700; letter-spacing: .08em; line-height: 1.1; }
.p6 .join p { margin-top: 6px; font-size: 32px; font-weight: 500; letter-spacing: .06em; }
.p6 .qr { width: 120px; height: 120px; border: 4px dashed var(--surface); border-radius: 12px; display: grid; place-content: center; font-size: 36px; font-weight: 700; letter-spacing: .1em; text-indent: .1em; }
</style>
</head>
<body>
<div class="pv"><div class="pv__fit">
<main class="poster" id="poster" data-cid="PS-006" data-name="会员招募竖版" data-size="1080×1440" data-use="招募">
<div class="p6">
  <div class="wash"></div>
  <div class="x-tex"></div>
  <div class="brand"><img data-ic="bouquet" src="../../../../kit/assets/icons/flat/bouquet.webp" alt="">花间集</div>
  <h1 class="title"><b>金卡</b>会员招募</h1>
  <p class="sub">入会免费</p>
  <div class="ring b"></div><div class="ring"></div>
  <div class="arch"><img src="../../../../kit/assets/photo/bg-floral.webp" alt="粉芍药"></div>
  <img class="ic star" data-ic="star" src="../../../../kit/assets/icons/flat/star.webp" alt="">
  <img class="ic card" data-ic="giftcard" src="../../../../kit/assets/icons/flat/giftcard.webp" alt="">
  <img class="ic heart" data-ic="heart" src="../../../../kit/assets/icons/flat/heart.webp" alt="">
  <img class="ic coupon" data-ic="coupon" src="../../../../kit/assets/icons/flat/coupon.webp" alt="">
  <div class="perks">
    <div class="perk"><i>01</i><h3>生日九折</h3><p>生日当月全场</p></div>
    <div class="perk"><i>02</i><h3>积分翻倍</h3><p>每单累计</p></div>
    <div class="perk"><i>03</i><h3>每季赠花</h3><p>小花一束</p></div>
  </div>
  <div class="join"><div><h4>扫码入会</h4><p>建国路店 徐汇滨江店 浦东世纪店</p></div><div class="qr">扫码</div></div>
</div>
</main>
</div></div>
<script src="../../../../kit/ui.js"></script>
<script>
(function () {
  var q = new URLSearchParams(location.search), root = document.documentElement;
  if (q.get('export') === '1') root.classList.add('is-export');
  if (q.get('bleed') === '1') root.classList.add('is-bleed');
  var p = document.getElementById('poster'), fit = p.parentNode;
  function fitIt() {
    if (root.classList.contains('is-export')) { fit.style.setProperty('--k', 1); return; }
    var k = Math.min((innerWidth - 48) / p.offsetWidth, (innerHeight - 48) / p.offsetHeight, 1);
    fit.style.setProperty('--k', Math.max(k, 0.05));
  }
  addEventListener('resize', fitIt); fitIt();
  var pg = document.createElement('style');
  pg.textContent = '@page{size:' + p.offsetWidth + 'px ' + p.offsetHeight + 'px;margin:0}';
  document.head.appendChild(pg);
  if (root.classList.contains('is-bleed') && !root.classList.contains('is-export')) {
    var m = document.createElement('div'); m.className = 'marks'; m.setAttribute('aria-hidden', 'true');
    var b = parseFloat(getComputedStyle(p).getPropertyValue('--bleed')) || 11.34, L = 20, G = 4;
    var W = p.offsetWidth, H = p.offsetHeight;
    [[0, 0], [1, 0], [0, 1], [1, 1]].forEach(function (c) {
      var x = c[0] ? W - b : b, y = c[1] ? H - b : b;
      var v = [x - 0.5, c[1] ? H + G : -G - L, 1, L], h = [c[0] ? W + G : -G - L, y - 0.5, L, 1];
      [v, h].forEach(function (r) {
        var i = document.createElement('i'); i.style.cssText = 'left:' + r[0] + 'px;top:' + r[1] + 'px;width:' + r[2] + 'px;height:' + r[3] + 'px';
        m.appendChild(i);
      });
    });
    m.style.cssText = 'position:absolute;left:0;top:0;width:' + W + 'px;height:' + H + 'px;transform:scale(var(--k));transform-origin:0 0;pointer-events:none';
    fit.appendChild(m);
  }
})();
</script>
</body>
</html>
