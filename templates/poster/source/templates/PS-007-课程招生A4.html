<!doctype html>
<html lang="zh-CN" data-ic-base="../../../../kit/assets/icons">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>课程招生A4</title>
<link rel="icon" href="../../../../kit/assets/icons/flat/bouquet.webp">
<link rel="stylesheet" href="../../../../kit/tokens.css">
<style>
:root { --tw: 794px; --th: 1123px; --bleed: 0mm; --pw: calc(var(--tw) + var(--bleed) * 2); --ph: calc(var(--th) + var(--bleed) * 2); }
:root.is-bleed { --bleed: 3mm; }
/* 海报画布与预览：画布大小写死，页面按视口缩放预览；地址加 ?export=1 去掉缩放与外框，用于导出 */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: color-mix(in srgb, var(--ink) 12%, var(--bg)); font: 400 16px/1.5 var(--font); color: var(--ink); -webkit-font-smoothing: antialiased; }
.pv { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
.pv__fit { --k: 1; position: relative; width: calc(var(--pw) * var(--k)); height: calc(var(--ph) * var(--k)); box-shadow: var(--elev-3); }
.poster { position: absolute; left: 0; top: 0; width: var(--pw); height: var(--ph); overflow: hidden; transform: scale(var(--k)); transform-origin: 0 0; background: var(--bg); color: var(--ink); font-family: var(--font); line-height: 1.3; text-rendering: optimizeLegibility; }
.poster *, .poster *::before, .poster *::after { margin: 0; padding: 0; }
.poster img { display: block; }
.poster h1, .poster h2, .poster h3, .poster p { font-weight: inherit; }
.x-tex { position: absolute; inset: 0; background: url(../../../../kit/assets/photo/pattern-petals.webp) 0 0 / 520px; opacity: .45; pointer-events: none; }
.x-nw { white-space: nowrap; }
.is-export body, .is-export { background: transparent; }
.is-export .pv { display: block; min-height: 0; padding: 0; }
.is-export .pv__fit { --k: 1; box-shadow: none; }
.marks i { position: absolute; background: var(--ink-2); }
@media print { html, body { background: none; } .pv { display: block; min-height: 0; padding: 0; } .pv__fit { --k: 1; box-shadow: none; } .marks { display: none; } }

/* ── 本海报 ── */
.p7 .fill { position: absolute; inset: 0; background: var(--bg); }
.p7 .band { position: absolute; left: 0; right: 0; top: 0; height: calc(var(--bleed) + 340px); overflow: hidden; }
.p7 .band img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 45%; }
.p7 .band::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, color-mix(in srgb, var(--bg) 55%, transparent) 0%, transparent 55%); }
.p7 .trim { position: absolute; inset: var(--bleed); }
.p7 .brand { position: absolute; left: 56px; top: 48px; display: flex; align-items: center; gap: 10px; font-size: 28px; font-weight: 600; letter-spacing: .08em; }
.p7 .brand img { width: 44px; height: 44px; }
.p7 .disc { position: absolute; right: 56px; top: 196px; width: 212px; height: 212px; border-radius: 50%; overflow: hidden; border: 8px solid var(--surface); box-shadow: var(--elev-3); }
.p7 .disc img { width: 100%; height: 100%; object-fit: cover; }
.p7 .kick { position: absolute; left: 56px; top: 380px; display: flex; align-items: center; gap: 14px; font-size: 22px; font-weight: 600; letter-spacing: .3em; color: var(--action-press); }
.p7 .kick::before { content: ""; width: 44px; height: 3px; background: var(--action-press); }
.p7 .title { position: absolute; left: 52px; top: 420px; font-size: 96px; font-weight: 700; letter-spacing: .01em; line-height: 1.1; white-space: nowrap; }
.p7 .title b { color: var(--action); font-weight: 700; }
.p7 .sub { position: absolute; left: 58px; top: 544px; font-size: 28px; font-weight: 500; color: var(--ink-2); letter-spacing: .08em; }
.p7 .tbl { position: absolute; left: 56px; right: 56px; top: 618px; }
.p7 .tr { display: grid; grid-template-columns: 1.5fr 1fr 1fr 1.2fr; align-items: center; height: 70px; border-bottom: 2px solid var(--line-strong); }
.p7 .tr.h { height: 52px; border-bottom: 3px solid var(--ink); font-size: 22px; font-weight: 500; letter-spacing: .3em; color: var(--action-press); }
.p7 .tr > :nth-child(n+2) { text-align: center; }
.p7 .tr > :last-child { text-align: right; }
.p7 .tr .n { font-size: 32px; font-weight: 600; letter-spacing: .04em; }
.p7 .tr .v { font-size: 28px; color: var(--ink-2); }
.p7 .tr .p { font-size: 38px; font-weight: 700; color: var(--price); font-variant-numeric: tabular-nums; }
.p7 .tr .p small { font-size: 22px; font-weight: 600; margin-right: 2px; }
.p7 .foot { position: absolute; left: 56px; right: 56px; bottom: 56px; display: flex; align-items: flex-end; justify-content: space-between; }
.p7 .foot dl { display: flex; gap: 48px; padding-bottom: 8px; }
.p7 .foot dt { font-size: 22px; font-weight: 500; letter-spacing: .3em; color: var(--action-press); }
.p7 .foot dd { font-size: 30px; font-weight: 600; margin-top: 2px; }
.p7 .qr { width: 132px; height: 132px; border: 3px dashed var(--action); border-radius: 10px; display: grid; place-content: center; font-size: 34px; font-weight: 700; letter-spacing: .1em; text-indent: .1em; color: var(--action-press); }
</style>
</head>
<body>
<div class="pv"><div class="pv__fit">
<main class="poster" id="poster" data-cid="PS-007" data-name="课程招生A4" data-size="794×1123" data-use="招募">
<div class="p7">
  <div class="fill"></div>
  <div class="band"><img src="../../../../kit/assets/photo/scene-hero-pink.webp" alt="粉色花束"></div>
  <div class="trim">
    <div class="brand"><img data-ic="bouquet" src="../../../../kit/assets/icons/flat/bouquet.webp" alt="">花间集</div>
    <div class="disc"><img src="../../../../kit/assets/photo/bouquet-white.webp" alt="白色花束"></div>
    <div class="kick">招生简章</div>
    <h1 class="title">花艺课程<b>招生</b></h1>
    <p class="sub">小班教学 每人一席 作品带回家</p>
    <div class="tbl">
      <div class="tr h"><div>课程</div><div>课时</div><div>人数</div><div>学费</div></div>
      <div class="tr"><div class="n">基础入门</div><div class="v">六课时</div><div class="v">八人</div><div class="p"><small>¥</small>680</div></div>
      <div class="tr"><div class="n">进阶花艺</div><div class="v">十课时</div><div class="v">六人</div><div class="p"><small>¥</small>1280</div></div>
      <div class="tr"><div class="n">作品认证</div><div class="v">十二课时</div><div class="v">六人</div><div class="p"><small>¥</small>1980</div></div>
    </div>
    <div class="foot">
      <dl><div><dt>上课</dt><dd>每周六 周日</dd></div><div><dt>地点</dt><dd>建国路店三楼教室</dd></div></dl>
      <div class="qr">扫码</div>
    </div>
  </div>
</div>
</main>
</div></div>
<script src="../../../../kit/ui.js"></script>
<script>
(function () {
  var q = new URLSearchParams(location.search), root = document.documentElement;
  if (q.get('export') === '1') root.classList.add('is-export');
  if (q.get('bleed') === '1') root.classList.add('is-bleed');
  var p = document.getElementById('poster'), fit = p.parentNode;
  function fitIt() {
    if (root.classList.contains('is-export')) { fit.style.setProperty('--k', 1); return; }
    var k = Math.min((innerWidth - 48) / p.offsetWidth, (innerHeight - 48) / p.offsetHeight, 1);
    fit.style.setProperty('--k', Math.max(k, 0.05));
  }
  addEventListener('resize', fitIt); fitIt();
  var pg = document.createElement('style');
  pg.textContent = '@page{size:' + p.offsetWidth + 'px ' + p.offsetHeight + 'px;margin:0}';
  document.head.appendChild(pg);
  if (root.classList.contains('is-bleed') && !root.classList.contains('is-export')) {
    var m = document.createElement('div'); m.className = 'marks'; m.setAttribute('aria-hidden', 'true');
    var b = parseFloat(getComputedStyle(p).getPropertyValue('--bleed')) || 11.34, L = 20, G = 4;
    var W = p.offsetWidth, H = p.offsetHeight;
    [[0, 0], [1, 0], [0, 1], [1, 1]].forEach(function (c) {
      var x = c[0] ? W - b : b, y = c[1] ? H - b : b;
      var v = [x - 0.5, c[1] ? H + G : -G - L, 1, L], h = [c[0] ? W + G : -G - L, y - 0.5, L, 1];
      [v, h].forEach(function (r) {
        var i = document.createElement('i'); i.style.cssText = 'left:' + r[0] + 'px;top:' + r[1] + 'px;width:' + r[2] + 'px;height:' + r[3] + 'px';
        m.appendChild(i);
      });
    });
    m.style.cssText = 'position:absolute;left:0;top:0;width:' + W + 'px;height:' + H + 'px;transform:scale(var(--k));transform-origin:0 0;pointer-events:none';
    fit.appendChild(m);
  }
})();
</script>
</body>
</html>
