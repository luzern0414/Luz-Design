<head>

<style>
:root { --tw: 794px; --th: 1123px; --bleed: 0mm; --pw: calc(var(--tw) + var(--bleed) * 2); --ph: calc(var(--th) + var(--bleed) * 2); }
:root.is-bleed { --bleed: 3mm; }
/* 海报画布与预览：画布大小写死，页面按视口缩放预览；地址加 ?export=1 去掉缩放与外框，用于导出 */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: color-mix(in srgb, var(--ink) 12%, var(--bg)); font: 400 16px/1.5 var(--font); color: var(--ink); -webkit-font-smoothing: antialiased; }
.pv { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
.pv__fit { --k: 1; position: relative; width: calc(var(--pw) * var(--k)); height: calc(var(--ph) * var(--k)); box-shadow: var(--elev-3); }
.poster { position: absolute; left: 0; top: 0; width: var(--pw); height: var(--ph); overflow: hidden; transform: scale(var(--k)); transform-origin: 0 0; background: var(--bg); color: var(--ink); font-family: var(--font); line-height: 1.3; text-rendering: optimizeLegibility; }
.poster *, .poster *::before, .poster *::after { margin: 0; padding: 0; }
.poster img { display: block; }
.poster h1, .poster h2, .poster h3, .poster p { font-weight: inherit; }
.x-tex { position: absolute; inset: 0; background: url(../../../../kit/assets/photo/pattern-petals.webp) 0 0 / 520px; opacity: .45; pointer-events: none; }
.x-nw { white-space: nowrap; }
.is-export body, .is-export { background: transparent; }
.is-export .pv { display: block; min-height: 0; padding: 0; }
.is-export .pv__fit { --k: 1; box-shadow: none; }
.marks i { position: absolute; background: var(--ink-2); }
@media print { html, body { background: none; } .pv { display: block; min-height: 0; padding: 0; } .pv__fit { --k: 1; box-shadow: none; } .marks { display: none; } }

/* ── 本海报 ── */
.p8 .fill { position: absolute; inset: 0; background: var(--action-tint); overflow: hidden; }
.p8 .fill .c1 { position: absolute; left: 330px; top: calc(-260px); width: 600px; height: 600px; border-radius: 50%; background: color-mix(in srgb, var(--action) 20%, var(--bg)); }
.p8 .fill .c2 { position: absolute; left: -200px; bottom: -280px; width: 520px; height: 520px; border-radius: 50%; background: color-mix(in srgb, var(--accent) 12%, var(--bg)); }
.p8 .fill .x-tex { opacity: .35; -webkit-mask-image: linear-gradient(180deg, black 0%, transparent 40%); mask-image: linear-gradient(180deg, black 0%, transparent 40%); }
.p8 .trim { position: absolute; inset: var(--bleed); }
.p8 .brand { position: absolute; left: 56px; top: 48px; display: flex; align-items: center; gap: 10px; font-size: 28px; font-weight: 600; letter-spacing: .08em; }
.p8 .brand img { width: 44px; height: 44px; }
.p8 .disc { position: absolute; left: 470px; top: 80px; width: 250px; height: 250px; border-radius: 50%; overflow: hidden; border: 8px solid var(--surface); box-shadow: var(--elev-3); }
.p8 .disc img { width: 100%; height: 100%; object-fit: cover; transform: scale(1.1); }
.p8 .title { position: absolute; left: 52px; top: 334px; font-size: 108px; font-weight: 700; letter-spacing: -.01em; line-height: 1.1; white-space: nowrap; }
.p8 .title b { color: var(--action); font-weight: 700; }
.p8 .sub { position: absolute; left: 58px; top: 470px; font-size: 30px; font-weight: 500; letter-spacing: .1em; color: var(--ink-2); }
.p8 .roles { position: absolute; left: 56px; right: 56px; top: 540px; border-top: 3px solid var(--ink); }
.p8 .role { height: 116px; display: flex; align-items: center; gap: 28px; border-bottom: 2px solid var(--line-strong); }
.p8 .role .num { width: 118px; font-size: 92px; font-weight: 700; color: var(--action); line-height: 1; font-variant-numeric: tabular-nums; }
.p8 .role .num small { font-size: 28px; font-weight: 600; margin-left: 4px; color: var(--action-press); }
.p8 .role .main { flex: 1; }
.p8 .role h3 { font-size: 40px; font-weight: 700; letter-spacing: .04em; }
.p8 .role p { margin-top: 4px; font-size: 26px; color: var(--ink-2); }
.p8 .role .pay { text-align: right; font-size: 24px; font-weight: 500; color: var(--ink-2); line-height: 1.2; }
.p8 .role .pay b { display: block; font-size: 38px; font-weight: 700; color: var(--price); font-variant-numeric: tabular-nums; }
.p8 .role .pay b small { font-size: 22px; font-weight: 600; margin-right: 2px; }
.p8 .foot { position: absolute; left: 56px; right: 56px; bottom: 56px; display: flex; align-items: flex-end; justify-content: space-between; }
.p8 .perks { display: flex; gap: 34px; }
.p8 .perk { display: grid; justify-items: center; gap: 8px; font-size: 26px; font-weight: 600; letter-spacing: .04em; }
.p8 .perk img { width: 72px; height: 72px; }
.p8 .qr { width: 132px; height: 132px; border: 3px dashed var(--action); border-radius: 10px; display: grid; place-content: center; font-size: 34px; font-weight: 700; letter-spacing: .1em; text-indent: .1em; color: var(--action-press); background: color-mix(in srgb, var(--surface) 70%, transparent); }
.p8 .qrw { display: flex; align-items: center; gap: 18px; }
.p8 .qrw span { font-size: 28px; font-weight: 600; letter-spacing: .06em; text-align: right; line-height: 1.3; }
</style>
</head>
<body>
<div class="pv"><div class="pv__fit">
<main class="poster" id="poster" data-cid="PS-008" data-name="招聘招募A4" data-size="794×1123" data-use="招募">
<div class="p8">
  <div class="fill"><div class="x-tex"></div><div class="c1"></div><div class="c2"></div></div>
  <div class="trim">
    <div class="brand"><img data-ic="bouquet" src="../../../../kit/assets/icons/flat/bouquet.webp" alt="">花间集</div>
    <div class="disc"><img src="../../../../kit/assets/photo/product-monstera.webp" alt="龟背竹盆栽"></div>
    <h1 class="title">招募花艺<b>伙伴</b></h1>
    <p class="sub">三家门店同步招募 长期有效</p>
    <div class="roles">
      <div class="role"><div class="num">3<small>人</small></div><div class="main"><h3>花艺师</h3><p>一年以上花艺经验</p></div><div class="pay">月薪<b><small>¥</small>6000 起</b></div></div>
      <div class="role"><div class="num">2<small>人</small></div><div class="main"><h3>配送员</h3><p>熟悉同城路线 自带电动车</p></div><div class="pay">月薪<b><small>¥</small>5000 起</b></div></div>
      <div class="role"><div class="num">1<small>人</small></div><div class="main"><h3>店长助理</h3><p>三年以上零售管理经验</p></div><div class="pay">月薪<b><small>¥</small>8000 起</b></div></div>
    </div>
    <div class="foot">
      <div class="perks">
        <div class="perk"><img data-ic="wallet" src="../../../../kit/assets/icons/flat/wallet.webp" alt="">五险一金</div>
        <div class="perk"><img data-ic="heart" src="../../../../kit/assets/icons/flat/heart.webp" alt="">节日福利</div>
        <div class="perk"><img data-ic="scooter" src="../../../../kit/assets/icons/flat/scooter.webp" alt="">交通补贴</div>
      </div>
      <div class="qrw"><span>投递简历</span><div class="qr">扫码</div></div>
    </div>
  </div>
</div>
</main>
</div></div>
<script src="../../../../kit/ui.js"></script>
<script>
(function () {
  var q = new URLSearchParams(location.search), root = document.documentElement;
  if (q.get('export') === '1') root.classList.add('is-export');
  if (q.get('bleed') === '1') root.classList.add('is-bleed');
  var p = document.getElementById('poster'), fit = p.parentNode;
  function fitIt() {
    if (root.classList.contains('is-export')) { fit.style.setProperty('--k', 1); return; }
    var k = Math.min((innerWidth - 48) / p.offsetWidth, (innerHeight - 48) / p.offsetHeight, 1);
    fit.style.setProperty('--k', Math.max(k, 0.05));
  }
  addEventListener('resize', fitIt); fitIt();
  var pg = document.createElement('style');
  pg.textContent = '@page{size:' + p.offsetWidth + 'px ' + p.offsetHeight + 'px;margin:0}';
  document.head.appendChild(pg);
  if (root.classList.contains('is-bleed') && !root.classList.contains('is-export')) {
    var m = document.createElement('div'); m.className = 'marks'; m.setAttribute('aria-hidden', 'true');
    var b = parseFloat(getComputedStyle(p).getPropertyValue('--bleed')) || 11.34, L = 20, G = 4;
    var W = p.offsetWidth, H = p.offsetHeight;
    [[0, 0], [1, 0], [0, 1], [1, 1]].forEach(function (c) {
      var x = c[0] ? W - b : b, y = c[1] ? H - b : b;
      var v = [x - 0.5, c[1] ? H + G : -G - L, 1, L], h = [c[0] ? W + G : -G - L, y - 0.5, L, 1];
      [v, h].forEach(function (r) {
        var i = document.createElement('i'); i.style.cssText = 'left:' + r[0] + 'px;top:' + r[1] + 'px;width:' + r[2] + 'px;height:' + r[3] + 'px';
        m.appendChild(i);
      });
    });
    m.style.cssText = 'position:absolute;left:0;top:0;width:' + W + 'px;height:' + H + 'px;transform:scale(var(--k));transform-origin:0 0;pointer-events:none';
    fit.appendChild(m);
  }
})();
</script>
</body>
