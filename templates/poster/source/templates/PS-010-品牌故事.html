<!doctype html>
<html lang="zh-CN" data-ic-base="../../../../kit/assets/icons">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>品牌故事图文</title>
<link rel="icon" href="../../../../kit/assets/icons/flat/bouquet.webp">
<link rel="stylesheet" href="../../../../kit/tokens.css">
<style>
:root { --pw: 1080px; --ph: 1440px; }
/* 海报画布与预览：画布大小写死，页面按视口缩放预览；地址加 ?export=1 去掉缩放与外框，用于导出 */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: color-mix(in srgb, var(--ink) 12%, var(--bg)); font: 400 16px/1.5 var(--font); color: var(--ink); -webkit-font-smoothing: antialiased; }
.pv { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
.pv__fit { --k: 1; position: relative; width: calc(var(--pw) * var(--k)); height: calc(var(--ph) * var(--k)); box-shadow: var(--elev-3); }
.poster { position: absolute; left: 0; top: 0; width: var(--pw); height: var(--ph); overflow: hidden; transform: scale(var(--k)); transform-origin: 0 0; background: var(--bg); color: var(--ink); font-family: var(--font); line-height: 1.3; text-rendering: optimizeLegibility; }
.poster *, .poster *::before, .poster *::after { margin: 0; padding: 0; }
.poster img { display: block; }
.poster h1, .poster h2, .poster h3, .poster p { font-weight: inherit; }
.x-tex { position: absolute; inset: 0; background: url(../../../../kit/assets/photo/pattern-petals.webp) 0 0 / 520px; opacity: .45; pointer-events: none; }
.x-nw { white-space: nowrap; }
.is-export body, .is-export { background: transparent; }
.is-export .pv { display: block; min-height: 0; padding: 0; }
.is-export .pv__fit { --k: 1; box-shadow: none; }
.marks i { position: absolute; background: var(--ink-2); }
@media print { html, body { background: none; } .pv { display: block; min-height: 0; padding: 0; } .pv__fit { --k: 1; box-shadow: none; } .marks { display: none; } }

/* ── 本海报 ── */
.p10 { position: absolute; inset: 0; background: var(--bg); }
.p10 .wash { position: absolute; inset: 0; background: radial-gradient(700px 700px at 100% 28%, color-mix(in srgb, var(--action) 14%, var(--bg)), transparent 70%); }
.p10 .head { position: absolute; left: 72px; right: 72px; top: 64px; display: flex; justify-content: space-between; align-items: center; }
.p10 .brand { display: flex; align-items: center; gap: 14px; font-size: 36px; font-weight: 600; letter-spacing: .08em; }
.p10 .brand img { width: 56px; height: 56px; }
.p10 .head span { font-size: 28px; font-weight: 500; letter-spacing: .3em; color: var(--action-press); }
.p10 .title { position: absolute; left: 68px; top: 156px; font-size: 148px; font-weight: 700; letter-spacing: -.01em; line-height: 1.1; white-space: nowrap; }
.p10 .title b { color: var(--action); font-weight: 700; }
.p10 .arch { position: absolute; left: 72px; top: 360px; width: 440px; height: 580px; border-radius: 220px 220px 0 0; overflow: hidden; box-shadow: var(--elev-2); }
.p10 .arch img { width: 100%; height: 100%; object-fit: cover; }
.p10 .disc { position: absolute; left: 700px; top: 360px; width: 308px; height: 308px; border-radius: 50%; overflow: hidden; border: 10px solid var(--surface); box-shadow: var(--elev-2); }
.p10 .disc img { width: 100%; height: 100%; object-fit: cover; }
.p10 .sq { position: absolute; left: 556px; top: 644px; width: 300px; height: 300px; border-radius: 40px; overflow: hidden; box-shadow: var(--elev-2); background: var(--action-tint); }
.p10 .sq img { width: 100%; height: 100%; object-fit: cover; }
.p10 .seal { position: absolute; left: 856px; top: 756px; width: 152px; height: 152px; border-radius: 50%; background: var(--accent); color: var(--surface); display: grid; place-content: center; text-align: center; box-shadow: var(--elev-2); }
.p10 .seal::before { content: ""; position: absolute; inset: 8px; border: 2px dashed color-mix(in srgb, var(--surface) 70%, transparent); border-radius: 50%; }
.p10 .seal strong { font-size: 38px; font-weight: 700; letter-spacing: .06em; line-height: 1.2; }
.p10 .story { position: absolute; left: 72px; top: 984px; width: 470px; }
.p10 .story h2 { font-size: 40px; font-weight: 700; letter-spacing: .06em; display: flex; align-items: center; gap: 16px; }
.p10 .story h2::before { content: ""; width: 10px; height: 40px; border-radius: 5px; background: var(--accent); }
.p10 .story p { margin-top: 18px; font-size: 30px; line-height: 1.7; color: var(--ink-2); }
.p10 .stats { position: absolute; left: 596px; right: 72px; top: 984px; border-top: 3px solid var(--ink); }
.p10 .stat { height: 100px; display: flex; align-items: center; gap: 20px; border-bottom: 2px solid var(--line-strong); }
.p10 .stat b { width: 160px; font-size: 84px; font-weight: 700; line-height: 1; color: var(--action); font-variant-numeric: tabular-nums; text-align: right; }
.p10 .stat span { font-size: 32px; font-weight: 600; letter-spacing: .04em; line-height: 1.25; }
.p10 .foot { position: absolute; left: 72px; right: 72px; bottom: 56px; display: flex; align-items: center; justify-content: space-between; font-size: 30px; color: var(--ink-2); letter-spacing: .06em; }
.p10 .foot b { font-size: 36px; color: var(--ink); font-weight: 700; letter-spacing: .08em; }
</style>
</head>
<body>
<div class="pv"><div class="pv__fit">
<main class="poster" id="poster" data-cid="PS-010" data-name="品牌故事图文" data-size="1080×1440" data-use="品牌">
<div class="p10">
  <div class="wash"></div>
  <div class="head"><div class="brand"><img data-ic="bouquet" src="../../../../kit/assets/icons/flat/bouquet.webp" alt="">花间集</div><span>品牌故事</span></div>
  <h1 class="title">从一束花<b>开始</b></h1>
  <div class="arch"><img src="../../../../kit/assets/photo/bouquet-white.webp" alt="白色花束"></div>
  <div class="disc"><img src="../../../../kit/assets/photo/bouquet-rose.webp" alt="粉玫瑰花束"></div>
  <div class="sq"><img src="../../../../kit/assets/photo/product-succulent.webp" alt="多肉组合盆"></div>
  <div class="seal"><strong>每日<br>现采</strong></div>
  <div class="story">
    <h2>小店</h2>
    <p>花间集从社区里的一间小店开始。每天清晨从产地挑选当季鲜花，按季节搭配，亲手包扎，送到每一位客人手里。</p>
  </div>
  <div class="stats">
    <div class="stat"><b>3</b><span>家门店<br>同城布局</span></div>
    <div class="stat"><b>6</b><span>点进货<br>每日清晨</span></div>
    <div class="stat"><b>2</b><span>小时送达<br>同城配送</span></div>
  </div>
  <div class="foot"><b>花间集</b><span>建国路店 徐汇滨江店 浦东世纪店</span></div>
</div>
</main>
</div></div>
<script src="../../../../kit/ui.js"></script>
<script>
(function () {
  var q = new URLSearchParams(location.search), root = document.documentElement;
  if (q.get('export') === '1') root.classList.add('is-export');
  if (q.get('bleed') === '1') root.classList.add('is-bleed');
  var p = document.getElementById('poster'), fit = p.parentNode;
  function fitIt() {
    if (root.classList.contains('is-export')) { fit.style.setProperty('--k', 1); return; }
    var k = Math.min((innerWidth - 48) / p.offsetWidth, (innerHeight - 48) / p.offsetHeight, 1);
    fit.style.setProperty('--k', Math.max(k, 0.05));
  }
  addEventListener('resize', fitIt); fitIt();
  var pg = document.createElement('style');
  pg.textContent = '@page{size:' + p.offsetWidth + 'px ' + p.offsetHeight + 'px;margin:0}';
  document.head.appendChild(pg);
  if (root.classList.contains('is-bleed') && !root.classList.contains('is-export')) {
    var m = document.createElement('div'); m.className = 'marks'; m.setAttribute('aria-hidden', 'true');
    var b = parseFloat(getComputedStyle(p).getPropertyValue('--bleed')) || 11.34, L = 20, G = 4;
    var W = p.offsetWidth, H = p.offsetHeight;
    [[0, 0], [1, 0], [0, 1], [1, 1]].forEach(function (c) {
      var x = c[0] ? W - b : b, y = c[1] ? H - b : b;
      var v = [x - 0.5, c[1] ? H + G : -G - L, 1, L], h = [c[0] ? W + G : -G - L, y - 0.5, L, 1];
      [v, h].forEach(function (r) {
        var i = document.createElement('i'); i.style.cssText = 'left:' + r[0] + 'px;top:' + r[1] + 'px;width:' + r[2] + 'px;height:' + r[3] + 'px';
        m.appendChild(i);
      });
    });
    m.style.cssText = 'position:absolute;left:0;top:0;width:' + W + 'px;height:' + H + 'px;transform:scale(var(--k));transform-origin:0 0;pointer-events:none';
    fit.appendChild(m);
  }
})();
</script>
</body>
</html>
