<!doctype html>
<html lang="zh-CN" data-theme="navy" data-bg="none" data-ic-base="../../../../kit/assets/icons">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>经营后台</title>
<link rel="icon" href="../../../../kit/assets/icons/flat/bouquet.webp">
<link rel="stylesheet" href="../../../../kit/tokens.css">
<link rel="stylesheet" href="../../../../kit/ui.css">
<link rel="stylesheet" href="../../../../kit/kit.css">
<link rel="stylesheet" href="../../../../kit/web.css">
<style>
  .dashboard {
    --chart-main: #285b88;
    --channel-online: #34758e;
    --channel-store: #7055a1;
    --channel-phone: #a36025;
    margin-top: var(--s-5);
  }
  .head__period { color: var(--ink-2); font-size: var(--fs-sm); }
  .dashboard__overview, .dashboard__totals { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .dashboard__overview > :first-child, .dashboard__totals > .card { grid-column: span 2; }
  .dashboard .card { min-width: 0; overflow: hidden; }
  .dashboard .section__head { padding: var(--s-4) var(--s-5) 0; }
  .dashboard .section__body { margin-top: 0; }
  .dashboard__overview > .card {
    border-end-start-radius: 0; border-end-end-radius: 0;
  }
  .dashboard__totals > .card {
    border-block-start-width: 0; border-start-start-radius: 0; border-start-end-radius: 0;
  }

  .chart-card { padding: var(--s-3) var(--s-5) var(--s-4); }
  .chart canvas { height: 218px; cursor: crosshair; }
  .chart canvas:focus-visible { outline-offset: -2px; }
  .chart__read {
    min-height: 36px; padding-top: var(--s-2); margin-top: var(--s-2);
    border-top: 1px solid var(--line); color: var(--ink-2);
    font-size: var(--fs-sm); font-variant-numeric: tabular-nums;
  }
  .chart__unit { font-size: var(--fs-xs); color: var(--ink-3); font-weight: 400; }
  .channel-chart { display: grid; gap: var(--s-3); justify-items: center; align-content: start; }
  .channel-chart .donut {
    --size: 132px; --c1: var(--channel-online); --c2: var(--channel-store); --c3: var(--channel-phone);
    --p1: 55%; --p2: 85%;
  }
  .channel-chart .donut::after { inset: 17%; }
  .channel-chart .legend { width: min(100%, 17rem); }
  .channel-chart .legend li { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; }
  .channel-chart .legend b { font-variant-numeric: tabular-nums; }

  .dashboard__totals .stat {
    display: grid; justify-items: start; align-content: start; gap: var(--s-1);
    width: min(100%, 18rem); margin-inline: auto; padding: var(--s-4) var(--s-5);
  }
  .dashboard__totals .stat dt { color: var(--ink-2); font-weight: 600; }
  .dashboard__totals .stat dd { font-size: var(--fs-2xl); font-weight: 700; font-variant-numeric: tabular-nums; }
  .dashboard__totals .stat small { margin-inline-start: 3px; font-size: var(--fs-sm); font-weight: 400; color: var(--ink-2); }

  .todo { min-height: 56px; }
  .todo .row__title { overflow-wrap: anywhere; }
  .todo .btn { flex-shrink: 0; padding-inline: var(--s-2); }
  .todo:has(.btn:disabled) .row__title { color: var(--ink-3); }
  @media (max-width: 1160px) {
    .dashboard__overview, .dashboard__totals { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); }
    .dashboard__overview > :first-child, .dashboard__totals > .card { grid-column: auto; }
    .dashboard__tasks { grid-column: 1 / -1; border-block-start-width: 0; border-start-start-radius: 0; border-start-end-radius: 0; }
  }
  @media (max-width: 760px) {
    .dashboard__overview, .dashboard__totals { grid-template-columns: minmax(0, 1fr); }
    .dashboard__overview > .card + .card { border-block-start-width: 0; border-start-start-radius: 0; border-start-end-radius: 0; }
    .dashboard__totals > .card:not(:last-child) { border-end-start-radius: 0; border-end-end-radius: 0; }
    .dashboard .section__head { padding-inline: var(--s-3); }
    .chart-card { padding-inline: var(--s-3); }
    .chart canvas { height: 184px; }
  }
</style>
</head>
<body class="web-body">
<div class="web">
  <!-- 左侧主导航：图文同行，当前项有背景与指示线；不放产品名 -->
  <nav class="rail" data-cid="WB-NAV-001" data-name="左侧主导航" aria-label="主导航">
    <img class="rail__logo" data-ic="bouquet" src="../../../../kit/assets/icons/flat/bouquet.webp" alt="">
    <a class="rail__item" href="home.html" aria-current="page"><img src="../../../../kit/assets/line/home.webp" alt=""><span>工作台</span></a>
    <a class="rail__item" href="list.html"><img src="../../../../kit/assets/line/list.webp" alt=""><span>列表</span></a>
    <a class="rail__item" href="orders.html"><img src="../../../../kit/assets/line/archive.webp" alt=""><span>订单</span></a>
    <a class="rail__item" href="agent.html"><img src="../../../../kit/assets/line/message.webp" alt=""><span>助手</span></a>
    <span class="rail__sp"></span>
    <a class="rail__item" href="mine.html"><img src="../../../../kit/assets/line/user.webp" alt=""><span>我的</span></a>
  </nav>

  <main class="main" aria-label="工作台"><div class="main__in">
    <header class="head" data-cid="WB-HOME-001" data-name="工作台数据范围">
      <div class="head__row"><span class="head__period">本周</span></div>
    </header>

    <div class="dashboard">
      <div class="grid card-grid dashboard__overview">
        <section class="card section" data-cid="WB-HOME-003" data-name="折线趋势图卡">
          <div class="section__head"><h2>销售趋势</h2><span class="chart__unit">万元</span></div>
          <div class="chart-card section__body">
            <div class="chart">
              <canvas id="trend" tabindex="0" aria-label="本周销售额折线图，左右方向键查看每日数值" aria-describedby="trend-read"></canvas>
              <p class="chart__read" id="trend-read" aria-live="polite"></p>
            </div>
          </div>
        </section>
        <section class="card section" data-cid="WB-HOME-004" data-name="环形占比图卡">
          <div class="section__head"><h2>订单来源</h2></div>
          <div class="chart-card channel-chart section__body">
            <div class="donut" aria-hidden="true"></div>
            <ul class="legend">
              <li><i style="--c:var(--channel-online)"></i><span>小程序</span><b>55%</b></li>
              <li><i style="--c:var(--channel-store)"></i><span>门店收银</span><b>30%</b></li>
              <li><i style="--c:var(--channel-phone)"></i><span>电话订花</span><b>15%</b></li>
            </ul>
          </div>
        </section>
        <section class="card section dashboard__tasks" data-cid="WB-HOME-007" data-name="待处理事项列表">
          <div class="section__head"><h2>待处理</h2></div>
          <div class="list section__body">
            <div class="row todo"><img class="compact-icon" src="../../../../kit/assets/line/list.webp" alt=""><div class="row__main"><p class="row__title">待发货订单</p></div><button class="btn btn--secondary btn--sm" type="button" aria-label="处理待发货订单" data-done>处理</button></div>
            <div class="row todo"><img class="compact-icon" src="../../../../kit/assets/line/message.webp" alt=""><div class="row__main"><p class="row__title">售后申请</p></div><button class="btn btn--secondary btn--sm" type="button" aria-label="处理售后申请" data-done>处理</button></div>
            <div class="row todo"><img class="compact-icon" src="../../../../kit/assets/line/folder.webp" alt=""><div class="row__main"><p class="row__title">库存预警</p></div><button class="btn btn--secondary btn--sm" type="button" aria-label="处理库存预警" data-done>处理</button></div>
          </div>
        </section>
      </div>

      <section class="grid card-grid dashboard__totals" aria-label="本周会员指标" data-cid="WB-HOME-002" data-name="核心指标卡">
        <article class="card">
          <dl class="stat"><dt>新增会员</dt><dd>316<small>人</small></dd></dl>
        </article>
        <article class="card">
          <dl class="stat"><dt>复购率</dt><dd>38.6<small>%</small></dd></dl>
        </article>
      </section>
    </div>
  </div></main>
</div>
<script src="../../../../kit/ui.js"></script>
<script>
  /* 折线图：保留真实顺序，不平滑；面积渐变、纵轴刻度、悬停与方向键都更新同区明细，换主题时重绘 */
  (() => {
    const cv = document.getElementById('trend'), read = document.getElementById('trend-read'), ctx = cv.getContext('2d');
    const labels = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
    const values = [1.42, 1.58, 1.69, 1.83, 2.26, 2.14, 1.94];
    const last = values.length - 1, pad = { l: 36, r: 12, t: 14, b: 28 };
    const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };
    let active = last;
    const draw = () => {
      const dpr = devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
      if (w <= pad.l + pad.r) return;
      const style = getComputedStyle(cv), css = n => style.getPropertyValue(n).trim();
      cv.width = w * dpr; cv.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, h);
      const max = Math.ceil(Math.max(...values) * 2) / 2;
      const x = i => pad.l + (w - pad.l - pad.r) * i / last;
      const y = v => pad.t + (h - pad.t - pad.b) * (1 - v / max);
      const action = css('--chart-main');
      ctx.font = `12px ${css('--font')}`; ctx.lineWidth = 1;
      for (let t = 0; t <= max; t += .5) {
        ctx.strokeStyle = css('--line'); ctx.beginPath(); ctx.moveTo(pad.l, y(t)); ctx.lineTo(w - pad.r, y(t)); ctx.stroke();
        ctx.fillStyle = css('--ink-3'); ctx.textAlign = 'right'; ctx.fillText(String(t), pad.l - 8, y(t) + 4);
      }
      labels.forEach((label, i) => {
        if (w < 280 && i % 2 !== 0) return;
        ctx.fillStyle = i === active ? css('--ink') : css('--ink-3');
        ctx.textAlign = i === last ? 'right' : 'center';
        ctx.fillText(label, i === last ? w - 3 : x(i), h - 6);
      });
      const g = ctx.createLinearGradient(0, pad.t, 0, h - pad.b); g.addColorStop(0, rgba(action, .14)); g.addColorStop(1, rgba(action, 0));
      ctx.beginPath(); ctx.moveTo(x(0), h - pad.b); values.forEach((v, i) => ctx.lineTo(x(i), y(v))); ctx.lineTo(x(last), h - pad.b); ctx.closePath(); ctx.fillStyle = g; ctx.fill();
      ctx.beginPath(); values.forEach((v, i) => (i ? ctx.lineTo(x(i), y(v)) : ctx.moveTo(x(i), y(v)))); ctx.strokeStyle = action; ctx.lineWidth = 2.5; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke();
      ctx.save(); ctx.setLineDash([4, 4]); ctx.strokeStyle = rgba(action, .5); ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x(active), pad.t); ctx.lineTo(x(active), h - pad.b); ctx.stroke(); ctx.restore();
      values.forEach((v, i) => { ctx.beginPath(); ctx.arc(x(i), y(v), i === active ? 5 : 3, 0, 7); ctx.fillStyle = i === active ? action : css('--surface'); ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = action; ctx.stroke(); });
      const point = `${labels[active]} ${values[active].toFixed(2)} 万元`;
      if (read.textContent !== point) read.textContent = point;
    };
    function select(i) {
      const next = Math.min(last, Math.max(0, i));
      if (next === active) return;
      active = next;
      draw();
    }
    const pick = cx => {
      const r = cv.getBoundingClientRect();
      select(Math.round((cx - r.left - pad.l) / (r.width - pad.l - pad.r) * last));
    };
    cv.addEventListener('pointermove', e => pick(e.clientX)); cv.addEventListener('pointerdown', e => pick(e.clientX));
    cv.addEventListener('keydown', e => { const d = { ArrowRight: 1, ArrowLeft: -1 }[e.key]; if (!d) return; e.preventDefault(); select(active + d); });
    new ResizeObserver(draw).observe(cv);
    new MutationObserver(draw).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  })();
  document.querySelectorAll('[data-done]').forEach(b => b.addEventListener('click', () => {
    b.disabled = true;
    b.textContent = '已处理';
    b.setAttribute('aria-label', '已处理' + b.closest('.todo').querySelector('.row__title').textContent);
    Lz.toast('已处理', 'success');
  }));
</script>
</body>
</html>
